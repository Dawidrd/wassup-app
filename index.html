<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wassup</title>
<meta name="description" content="Wassup: suplementy, które rozumiesz. Tracker magnezu i witaminy D.">
<meta name="theme-color" content="#0E1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wassup">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS-native shell (large title, scroll body, 5-tab bar); nutrient identity = capsule colours (Mg teal, D amber, B6 violet), text always in ink */
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#111915; --muted:#5E6B66; --faint:#8A9691; --line:#E1E6E4; --fill:#EAEFED;
  --brand:#0E5C4C; --brand-ink:#FFFFFF;
  --mg:#1baf7a; --d:#eda100; --b6:#4a3aa7;
  --ok:#1E7A4C; --ok-bg:#E2F2E9; --warn:#8A5A00; --warn-bg:#FBEFD2; --bad:#B3261E; --bad-bg:#FBE3E1;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --tab-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B100E; --card:#161D1A; --ink:#E8EEEB; --muted:#9BA9A3; --faint:#6F7D77; --line:#26302C; --fill:#1E2723;
  --brand:#5FC3A5; --brand-ink:#08130F;
  --mg:#199e70; --d:#c98500; --b6:#9085e9;
  --ok:#6FD3A0; --ok-bg:#163126; --warn:#F2C05A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A18;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B100E; --card:#161D1A; --ink:#E8EEEB; --muted:#9BA9A3; --faint:#6F7D77; --line:#26302C; --fill:#1E2723;
  --brand:#5FC3A5; --brand-ink:#08130F;
  --mg:#199e70; --d:#c98500; --b6:#9085e9;
  --ok:#6FD3A0; --ok-bg:#163126; --warn:#F2C05A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A18;
  color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
main{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px);max-width:560px;margin:0 auto}
.screen{display:grid;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.head h1{font-family:var(--f-round);font-size:34px;line-height:1.05;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.section-t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 4px -8px}
.card{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:12px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.dots{display:flex;gap:4px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.mg{background:var(--mg)}.dot.d{background:var(--d)}.dot.b6{background:var(--b6)}
.pname{font-weight:600}
.pmeta{font-size:13px;color:var(--muted)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .15s,border-color .15s}
.check svg{width:22px;height:22px;opacity:0}
.check.on{background:var(--brand);border-color:var(--brand)}
.check.on svg{opacity:1;color:var(--brand-ink)}
.count{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px;background:var(--fill);flex-shrink:0}
.datenav{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.none{background:var(--fill);color:var(--muted)}
.ntop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nname{display:flex;align-items:center;gap:8px;font-weight:600}
.big{font-family:var(--f-round);font-size:34px;font-weight:700;line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
.alt{font-size:14px;color:var(--muted)}
.scale{position:relative;height:44px;margin:4px 2px 0}
.track{position:absolute;left:0;right:0;top:8px;height:10px;border-radius:5px;background:var(--fill)}
.fillbar{position:absolute;left:0;top:8px;height:10px;border-radius:5px}
.mark{position:absolute;top:2px;width:2px;height:22px;background:var(--ink);opacity:.55;border-radius:1px}
.mark.ul{background:var(--bad);opacity:.9}
.mlabel{position:absolute;top:26px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.cmp{display:grid;gap:0;border-top:1px solid var(--line)}
.cmp div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp div:last-child{border-bottom:0}
.cmp span:last-child{text-align:right;color:var(--muted);flex-shrink:0}
.note{font-size:13.5px;color:var(--muted);background:var(--fill);border-radius:12px;padding:10px 12px}
.note.warn{background:var(--warn-bg);color:var(--ink)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.f input,.f select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-row>*{min-width:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-round);font-size:24px}
.stat span{font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .sel{font-size:14px;color:var(--muted);min-height:20px}
.claims{margin:0;padding-left:18px;font-size:14.5px}
.claims li{margin:6px 0}
.kv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px 14px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.src{font-size:12px;color:var(--faint)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--muted)}
.pill.lek{background:var(--warn-bg);color:var(--warn)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;height:var(--tab-h)}
.tab{display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;color:var(--faint)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:14px}
.sheet h2{font-family:var(--f-round);font-size:24px;margin:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--fill);font-size:24px;font-weight:600}
.stepper b{font-family:var(--f-round);font-size:40px;min-width:60px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.cal span.full{background:var(--brand);color:var(--brand-ink)}
.cal span.part{background:color-mix(in srgb,var(--brand) 35%,var(--fill))}
.cal span.future{opacity:.3}
.cal span.today{outline:2px solid var(--ink);outline-offset:-2px}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bar:#1E8C6A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bar:#4DB592} }
:root[data-theme="dark"]{--bar:#4DB592}
.fillbar{background:var(--bar)}
.syms{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;max-width:72px}
.sym{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:7px;border:1.5px solid var(--line);background:var(--fill);font-family:var(--f-round);font-size:11.5px;font-weight:700;color:var(--ink);line-height:1}
.nname .sym{margin-right:2px}
.kv dt .sym{margin-right:4px;vertical-align:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.locked{overflow:hidden}
.sheet{padding-top:0}
.sheet-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:var(--bg);padding:14px 0 10px;margin:0 -2px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:18px;text-align:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{display:grid;gap:14px}
.link{color:var(--brand);font-weight:600;font-size:16px;padding:6px 2px}
.switchrow{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--brand)}
.switch:checked::after{transform:translateX(20px)}
.fieldset{display:grid;gap:10px;background:var(--card);border-radius:14px;padding:14px}
.crow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-top:2px}
.crow select,.crow input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;min-width:0}
.crow .unit{font-size:14px;color:var(--muted);min-width:22px}
.crow select[data-k="u"]{width:auto}
.done{display:flex;align-items:center;gap:14px}

.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);color:var(--muted);font:700 11px/1 var(--f-round);font-style:italic;vertical-align:1px;margin-left:4px;flex-shrink:0}
.danger{position:absolute;right:0;top:8px;height:10px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(135deg,var(--bad-bg) 0 4px,color-mix(in srgb,var(--bad) 35%,var(--bad-bg)) 4px 6px)}
.fillbar.over{background:var(--bad)}
.mark.goal{background:var(--brand);opacity:1;width:3px}
.mlabel.ul{color:var(--bad);font-weight:600}
.mlabel.goal{color:var(--brand);font-weight:700}
.cmp .ulrow span:first-child b{color:var(--bad)}
.howto{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.ruler{display:flex;align-items:flex-end;gap:3px;height:34px;flex-shrink:0}
.ruler i{display:block;width:7px;border-radius:2px;background:var(--bar);opacity:.55}
.ruler i:nth-child(1){height:8px}.ruler i:nth-child(2){height:14px}.ruler i:nth-child(3){height:20px}.ruler i:nth-child(4){height:26px}.ruler i.u{height:34px;background:var(--bad);opacity:1}
.chev svg{width:16px;height:16px;color:var(--faint)}
.claims.small{font-size:13.5px;margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:st}
.steps li{position:relative;background:var(--card);border-radius:12px;padding:12px 12px 12px 44px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:700 12px var(--f-round);color:var(--muted)}
.steps li.ul{border:1.5px solid var(--bad)}
.steps li.ul::before{background:var(--bad);color:#fff}
.steps li.on{outline:2px solid var(--brand);outline-offset:-2px}

.checkrow{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);padding:4px 0}
.checkrow input{width:20px;height:20px;accent-color:var(--brand)}
.fsel{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.choice{text-align:left;width:100%;border:1.5px solid var(--line)}
.dietrow{align-items:flex-start}
.dietrow .sym{margin-top:2px}
.dietrow .chip{margin-top:2px}
.warnli{color:var(--bad)}
.diethero{border:1.5px solid var(--brand)}

/* v0.5 Badania */
.tabbar nav{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
button.card.labcard{width:100%;text-align:left;color:inherit;font:inherit}
.rbar{position:relative;height:40px}
.rtrack{position:absolute;left:0;right:0;top:9px;height:10px;border-radius:5px;background:var(--fill)}
.rband{position:absolute;top:9px;height:10px;background:var(--ok);opacity:.4;border-radius:5px}
.rdot{position:absolute;top:4px;width:20px;height:20px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--card);background:var(--ok);box-sizing:border-box}
.rdot.low{background:var(--warn)}.rdot.high{background:var(--bad)}.rdot.none{background:var(--muted)}
.rlab{position:absolute;top:24px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
svg.trend{width:100%;height:auto;display:block;overflow:visible}
.tdot{fill:var(--ok);stroke:var(--card);stroke-width:2}.tdot.low{fill:var(--warn)}.tdot.high{fill:var(--bad)}.tdot.none{fill:var(--muted)}
.lfprev{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
#lf-prev .seg button{font-size:12.5px;padding:8px 2px}
.note .link{font-size:14px;padding:0 2px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="tabbar"><nav id="tabs" aria-label="Nawigacja"></nav></div>
<div id="overlay"></div>

<script>
"use strict";
/* ============ Dane referencyjne (źródła: baza regulacyjna Wassup) ============
   RWS: rozp. 1169/2011 zał. XIII · normy i UL: Normy żywienia dla populacji Polski 2024 (NIZP PZH–PIB)
   limity GIS: uchwały Zespołu ds. Suplementów Diety · oświadczenia: rozp. 432/2012 */

/* ============ Stan i zapis ============ */
const KEY = "wassup.v1";
let S = load();
function blank(){ return { v:1, profile:null, products:[], log:{}, labs:[], prefs:{}, goals:{}, packs:[], foodMap:{}, diet:null, created:today() }; }
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && s.v===1){ fill(s); return s; } } }catch(e){} return blank(); }
function fill(s){ s.prefs=s.prefs||{}; s.labs=s.labs||[]; s.goals=s.goals||{}; s.packs=s.packs||[]; s.foodMap=s.foodMap||{}; labsMigrate(s); return s; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Nie udało się zapisać danych na tym urządzeniu"); } }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ============ Narzędzia ============ */
function today(){ return dkey(new Date()); }
function dkey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+dd; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function fmt(n,max){ return Number(n).toLocaleString("pl-PL",{maximumFractionDigits:max==null?1:max}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function plural(n,forms){ n=Math.abs(n); if(n===1) return forms[0]; if(!Number.isInteger(n)) return forms[1]; const d=n%10, h=n%100; if(d>=2&&d<=4&&(h<12||h>14)) return forms[1]; return forms[2]; }
function unitWord(p,n){ return plural(n, UNITS[p.unit]||UNITS.porcja); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function dayLabel(k){ const t=today(); if(k===t) return "Dziś"; if(k===addDays(t,-1)) return "Wczoraj"; return parseKey(k).toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"}); }
function longDate(k){ return parseKey(k).toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"}); }
function shortDate(k){ return parseKey(k).toLocaleDateString("pl-PL",{day:"numeric",month:"short"}); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function sym(n){ return `<span class="sym" title="${esc(NUTR[n].name)}">${NUTR[n].sym}</span>`; }
function syms(content){ return `<div class="syms">${Object.keys(content).filter(n=>content[n]&&NUTR[n]).map(sym).join("")}</div>`; }
function norms(){ const p=S.profile; if(!p) return {}; if(p.state==="preg") return NORMS.preg; if(p.state==="lact") return NORMS.lact; return (NORMS[p.sex]||NORMS.m)[p.age]||{}; }
function gisFor(n){
  const p=S.profile||{}, preg=p.state==="preg", lact=p.state==="lact";
  return ({ mg:400, d:p.age==="75+"?100:50, b6:6, c:1000, zn:15, b12:100, fe:preg?30:20, fol:preg?800:600, ca:1500, k:200, se:200, i:(preg||lact)?200:150, bio:null, pot:1500, om3:null })[n];
}
function taken(k,pid){ return (S.log[k]&&S.log[k][pid])||0; }
function totals(k){ const t={}, byType={}; for(const p of S.products){ const u=taken(k,p.id); if(!u) continue; for(const n in p.content){ const v=(p.content[n]||0)*u; if(!v) continue; t[n]=(t[n]||0)+v; byType[n]=byType[n]||{}; byType[n][p.type]=(byType[n][p.type]||0)+v; } } return {t,byType}; }
function planned(){ const t={}; for(const p of S.products) for(const n in p.content) if(p.content[n]) t[n]=(t[n]||0)+p.content[n]*p.daily; return t; }
function activeNutrients(){ const s=new Set(Object.keys(S.goals||{})); for(const p of S.products) for(const n in p.content) if(p.content[n]) s.add(n); return ORDER.filter(n=>s.has(n)); }
function status(n,v){
  const ul=NUTR[n].ul, gis=gisFor(n);
  if(!v) return {c:"none",t:"Brak dziś"};
  if(ul && v>ul+1e-9) return {c:"bad",t:"Powyżej UL"};
  if(ul && v>=ul-1e-9) return {c:"warn",t:"Na granicy UL"};
  if(gis && v>gis+1e-9) return {c:"warn",t:"Powyżej limitu GIS"};
  return {c:"ok",t:"Poniżej limitów"};
}
function stockLeft(p){ if(!p.stock || p.stock.count==null) return null; let used=0; for(const k in S.log){ if(k>=p.stock.since) used+=(S.log[k][p.id]||0); } return Math.max(0,p.stock.count-used); }
function runOut(p){ const left=stockLeft(p); if(left==null || !p.daily) return null; const days=Math.floor(left/p.daily); return {left,days,date:addDays(today(),days)}; }
function compText(p){ return "1 "+UNITS[p.unit][0]+": "+Object.keys(p.content).filter(n=>p.content[n]).map(n=>`${fmt(p.content[n])} ${NUTR[n].unit} ${NUTR[n].sym}${n==="d"?` (${fmt(p.content[n]*40,0)} IU)`:""}`).join(" + "); }
function doseText(p,u){ return Object.keys(p.content).filter(n=>p.content[n]).map(n=>`${fmt(p.content[n]*u)} ${NUTR[n].unit} ${NUTR[n].sym}${n==="d"?` (${fmt(p.content[n]*u*40,0)} IU)`:""}`).join(" + "); }

function infoBtn(k){ return `<button class="info" data-act="info" data-k="${k}" aria-label="Co to znaczy?">i</button>`; }
function nutrientCard(n,v,bt){
  const N=NUTR[n], nm=norms(), norm=nm[n], gis=gisFor(n), f=N.normFactor||1, goal=S.goals[n];
  let st=status(n,v);
  if(goal && st.c==="ok") st = v>=goal-1e-9 ? {c:"ok",t:"Cel osiągnięty"} : {c:"none",t:`${fmt(v/goal*100,0)}% celu`};
  if(goal && st.c==="none" && !v) st={c:"none",t:"0% celu"};
  const marks=[["RWS",N.rws,""],["norma",norm?norm/f:null,""],["GIS",gis,""],["cel",goal,"goal"],["UL",N.ul,"ul"]].filter(m=>m[1]);
  const max=Math.max(...marks.map(m=>m[1]*1.15), v*1.08, 1);
  const pct=x=>Math.min(100,x/max*100);
  const groups=[]; marks.slice().sort((a,b)=>a[1]-b[1]).forEach(m=>{ const g=groups.find(g=>Math.abs(g.v-m[1])<1e-9); if(g){ g.names.push(m[0]); if(m[2]) g.cls=m[2]; } else groups.push({v:m[1],names:[m[0]],cls:m[2]}); });
  const rows=[]; const labels=groups.map(g=>{ const x=pct(g.v), txt=g.names.join(" · "), w=Math.max(9,txt.length*1.9); let row=0; while((rows[row]||[]).some(o=>Math.abs(o.x-x)<(o.w+w)/2+1)) row++; (rows[row]=rows[row]||[]).push({x,w}); return {txt,cls:g.cls,x,row}; });
  const onlyLek=bt.lek && !bt.suplement, hasProd=S.products.some(p=>p.content[n]);
  return `<div class="card">
    <div class="ntop"><div><div class="nname">${sym(n)}${N.name}</div>
      <div style="margin-top:8px" class="big num">${fmt(v)}<small>${N.unit}${goal?` / ${fmt(goal)} ${N.unit}`:""}</small></div>
      ${n==="d"?`<div class="alt num">${fmt(v*40,0)} IU</div>`:""}</div>
      <span class="chip ${st.c}">${st.t}</span></div>
    <div class="scale" role="img" aria-label="${esc(N.name)}: ${fmt(v)} ${N.unit}${N.ul?`, granica bezpieczeństwa ${fmt(N.ul)} ${N.unit}`:""}">
      <div class="track"></div>
      ${N.ul?`<div class="danger" style="left:${pct(N.ul)}%"></div>`:""}
      <div class="fillbar ${N.ul&&v>N.ul+1e-9?"over":""}" style="width:${pct(v)}%"></div>
      ${labels.map(l=>`<i class="mark ${l.cls}" style="left:calc(${l.x}% - 1px)"></i><span class="mlabel ${l.cls}" style="left:${l.x}%;top:${26+l.row*12}px">${l.txt}</span>`).join("")}
    </div>
    <div class="cmp" style="margin-top:${Math.max(0,...labels.map(l=>l.row))*12}px">
      ${goal?`<div><span>Twój cel (${fmt(goal)} ${N.unit}) ${infoBtn("goal")}</span><span class="num">${fmt(v/goal*100,0)}%</span></div>`:""}
      ${S.diet&&!NOT_FROM_DIET[n]&&S.diet.intake[n]?`<div><span>Z diety (szacunek): ok. ${fmt(S.diet.intake[n],0)} ${N.unit}</span><span class="num">${norm?fmt(S.diet.intake[n]/norm*100,0)+"% normy":""}</span></div>`:""}
      ${N.rws?`<div><span>Etykieta: RWS ${fmt(N.rws)} ${N.unit} ${infoBtn("rws")}</span><span class="num">${fmt(v/N.rws*100,0)}%</span></div>`:""}
      ${norm?`<div><span>Twoja norma: ${fmt(norm)} ${n==="fol"?"µg DFE":N.unit} ${infoBtn("norm")}</span><span class="num">${fmt(v*f/norm*100,0)}%</span></div>`:""}
      ${gis?`<div><span>Limit GIS: ${fmt(gis)} ${N.unit} ${infoBtn("gis")}</span><span class="num">${v>gis+1e-9?"powyżej":"poniżej"}</span></div>`:""}
      ${N.ul?`<div class="ulrow"><span><b>Granica bezpieczeństwa: ${fmt(N.ul)} ${N.unit}</b> ${infoBtn("ul")}</span><span class="num">${v>N.ul+1e-9?"przekroczona":fmt(v/N.ul*100,0)+"%"}</span></div>`:`<div><span>Granica bezpieczeństwa ${infoBtn("ul")}</span><span>nie ustalono</span></div>`}
    </div>
    ${goal&&!hasProd?`<div class="note">Żaden produkt w Apteczce nie zawiera tego składnika. Dodaj produkt, żeby liczyć postęp do celu.</div>`:""}
    ${n==="mg"&&v?`<div class="note">${N.ulNote} Normę ${norm?fmt(norm)+" mg ":""}liczy się z dietą łącznie, więc resztę zwykle daje jedzenie.</div>`:""}
    ${n==="d"&&v>=N.ul-1e-9?`<div class="note warn">${fmt(v)} µg to ${v>N.ul?"więcej niż":"dokładnie"} granica bezpieczeństwa dla diety i suplementów razem. ${onlyLek?"Twój produkt to lek, więc limit GIS dla suplementów go nie dotyczy. ":""}O dawkę i badanie poziomu 25(OH)D zapytaj lekarza lub farmaceutę.</div>`:""}
    ${N.ul&&v>N.ul+1e-9&&n!=="d"?`<div class="note warn">Przekraczasz granicę bezpieczeństwa (UL). Porozmawiaj z lekarzem lub farmaceutą o dawce.</div>`:""}
    ${n!=="mg"&&n!=="d"&&gis&&v>gis+1e-9&&!(N.ul&&v>N.ul)&&!onlyLek?`<div class="note warn">Powyżej limitu, który Zespół ds. Suplementów Diety przy GIS przyjął dla dziennej porcji suplementu.</div>`:""}
    ${N.warn&&v?`<div class="note">${N.warn}</div>`:""}
  </div>`;
}

function histLabs(n){
  const ms=MARKERS.filter(x=>x.n===n); if(!ms.length) return "";
  const groups=labGroups().filter(a=>MK[a[0].m] && MK[a[0].m].n===n);
  return `<div class="card"><div class="pname">Wyniki badań: ${esc(NUTR[n].name)}</div>
    ${groups.length?`<dl class="kv">${groups.map(a=>{ const l=a[0], st=LST[labFlag(l)]; return `<dt>${esc(labName(l))}<br><span class="pmeta">${esc(fullDate(l.date))}</span></dt><dd class="num">${fmt(l.value,2)} ${esc(l.unit)}<br><span class="chip ${st.c}">${st.t}</span></dd>`; }).join("")}</dl>`
      :`<div class="pmeta">Brak zapisanych wyników. Przepisz wynik z wydruku, a Wassup porówna go z zakresem z tego wydruku.</div>`}
    <div class="btns"><button class="btn sec" data-act="lab-add" data-k="${ms[0].m}">Dodaj wynik</button>${groups.length?`<button class="btn sec" data-act="go-labs">Wszystkie badania</button>`:""}</div></div>`;
}
function streak(){ if(!S.products.length) return 0; let k=today(); const full=x=>S.products.every(p=>taken(x,p.id)>=p.daily); if(!full(k)) k=addDays(k,-1); let c=0; while(full(k) && c<3650){ c++; k=addDays(k,-1); } return c; }
function adherence(N){ let full=0,need=0,got=0,n=0; const start=S.created||today(); for(let i=0;i<N;i++){ const k=addDays(today(),-i); if(k<start) break; n++; let all=true; for(const p of S.products){ need+=p.daily; got+=Math.min(taken(k,p.id),p.daily); if(taken(k,p.id)<p.daily) all=false; } if(all && S.products.length) full++; } return {full,n,pct:need?Math.round(got/need*100):0}; }
function chartSVG(days,vals,n){
  const W=340,H=170,L=38,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B, N=NUTR[n], f=N.normFactor||1, normRaw=norms()[n], norm=normRaw?normRaw/f:null;
  const max=Math.max((N.ul||0)*1.15, (gisFor(n)||0)*1.1, (norm||0)*1.1, ...vals, 1);
  const y=v=>T+ph-(v/max)*ph, bw=pw/days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(N.name)} dziennie przez 30 dni">`;
  niceTicks(max).forEach(t=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t,1)}</text>`; });
  days.forEach((k,i)=>{ const v=vals[i], x=L+i*bw+1, w=Math.max(2,bw-2), h=Math.max(v?3:1.5,(v/max)*ph);
    s+=`<rect x="${x}" y="${T+ph-h}" width="${w}" height="${h}" rx="${Math.min(3,w/2)}" fill="${v?"var(--bar)":"var(--line)"}"/>`;
    s+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ph+B}" fill="transparent" data-day="${k}" data-v="${v}"/>`; });
  if(N.ul) s+=`<line x1="${L}" x2="${W-R}" y1="${y(N.ul)}" y2="${y(N.ul)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${y(N.ul)-4}" text-anchor="end" font-size="10" fill="var(--bad)">UL ${fmt(N.ul)}</text>`;
  if(norm && norm<max) s+=`<line x1="${L}" x2="${W-R}" y1="${y(norm)}" y2="${y(norm)}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${L+4}" y="${y(norm)-4}" font-size="10" fill="var(--muted)">norma ${fmt(norm)}</text>`;
  [0,14,29].forEach(i=>{ s+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="${i===0?"start":i===29?"end":"middle"}" font-size="10" fill="var(--muted)">${esc(i===29?"dziś":shortDate(days[i]))}</text>`; });
  return s+"</svg>";
}
function niceTicks(max){ const raw=max/3, mag=Math.pow(10,Math.floor(Math.log10(raw))); const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw); const out=[]; for(let v=0; v<=max+1e-9; v+=step) out.push(+v.toFixed(6)); return out; }
function bindChart(){ const svg=document.querySelector(".chart svg"); if(!svg) return; const n=document.getElementById("hist-n").value; svg.addEventListener("click",e=>{ const k=e.target.getAttribute("data-day"); if(!k) return; const v=+e.target.getAttribute("data-v"); document.getElementById("hsel").textContent=`${cap(longDate(k))}: ${fmt(v)} ${NUTR[n].unit}${n==="d"?` (${fmt(v*40,0)} IU)`:""}`; }); }
function calendar(){
  const t=today(), start=addDays(t,-34), offset=(parseKey(start).getDay()+6)%7;
  let cells=["pn","wt","śr","cz","pt","so","nd"].map(d=>`<span style="background:none">${d}</span>`).join("");
  for(let i=0;i<offset;i++) cells+=`<span style="background:none"></span>`;
  for(let i=0;i<35;i++){ const k=addDays(start,i); const sum=S.products.map(p=>Math.min(1,taken(k,p.id)/p.daily)).reduce((a,b)=>a+b,0);
    const cls=k>t?"future":sum>=S.products.length&&S.products.length?"full":sum>0?"part":""; cells+=`<span class="${cls} ${k===t?"today":""} num">${parseKey(k).getDate()}</span>`; }
  return `<div class="cal">${cells}</div>`;
}

function checkGoal(n,v){
  const N=NUTR[n], gis=gisFor(n);
  if(v==null || v<=0) return {err:"Wpisz liczbę większą od zera."};
  if(N.ul && v>N.ul+1e-9) return {err:`${N.name}: cel nie może przekraczać granicy bezpieczeństwa (${fmt(N.ul)} ${N.unit}).`};
  let warn=null;
  if(gis && v>gis+1e-9) warn=`${N.name}: cel powyżej limitu GIS dla suplementu (${fmt(gis)} ${N.unit}). Ma sens tylko przy leku lub zaleceniu lekarza.`;
  else if(N.rws && v<N.rws*0.15-1e-9) warn=`${N.name}: cel poniżej progu, od którego UE potwierdza działanie (${fmt(N.rws*0.15,2)} ${N.unit}).`;
  return {warn};
}

  <div class="fieldset"><div class="pname">Skład w 1 jednostce</div><div class="pmeta">Przepisz z tabeli składu na etykiecie: ilość samego składnika, nie całego związku.</div>
    <div id="rows">${rowsHTML()}</div>
    <button class="btn sec" data-act="row-add">+ Dodaj składnik</button></div>
  <label class="f">Forma (opcjonalnie)<input id="p-form" value="${esc(v.form||"")}" placeholder="np. cytrynian magnezu" autocomplete="off"></label>
  <div class="f-row"><label class="f">Twoja porcja dzienna<input id="p-daily" inputmode="decimal" value="${v.daily}"></label><label class="f">Zalecenie producenta<input id="p-prod" inputmode="decimal" value="${v.producerDaily||""}"></label></div>
  <label class="f">Ile sztuk zostało w opakowaniu (opcjonalnie)<input id="p-stock" inputmode="numeric" value="${p&&stockLeft(p)!=null?stockLeft(p):""}"></label>
  <button class="btn full" data-act="p-save" data-id="${p?p.id:""}">Zapisz</button>
  ${p?`<button class="btn danger full" data-act="p-del" data-id="${p.id}">Usuń z Apteczki</button>`:""}`);
}
function rowsHTML(){
  return FORM.rows.map((r,i)=>{ const used=FORM.rows.filter((x,j)=>j!==i).map(x=>x.n);
    return `<div class="crow">
      <select data-row="${i}" data-k="n" aria-label="Składnik ${i+1}"><option value="">Wybierz składnik</option>${ORDER.map(n=>`<option value="${n}" ${r.n===n?"selected":""} ${used.includes(n)?"disabled":""}>${esc(NUTR[n].name)}</option>`).join("")}</select>
      <input data-row="${i}" data-k="amt" inputmode="decimal" placeholder="ilość" value="${esc(r.amt)}" aria-label="Ilość">
      ${r.n==="d"?`<select data-row="${i}" data-k="u" aria-label="Jednostka"><option ${r.u!=="IU"?"selected":""}>µg</option><option ${r.u==="IU"?"selected":""}>IU</option></select>`:`<span class="unit">${r.n?NUTR[r.n].unit:""}</span>`}
      <button class="iconbtn" data-act="row-del" data-i="${i}" aria-label="Usuń składnik">${I.x}</button></div>`; }).join("");
}
function wipeSheet(){ sheet("Usunąć wszystkie dane?",`<div class="pmeta">Profil, Apteczka i cała historia znikną z tego telefonu. Tego nie da się cofnąć, chyba że masz kopię.</div><button class="btn danger full" data-act="wipe-yes">Usuń wszystko</button>`); }

function ffqIntake(ans){

function verdict(n,v,method){

/* Minimalny czytnik XLSX (zip + XML), bez zewnętrznych bibliotek: działa offline. */
async function unzipEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("To nie jest plik XLSX.");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const out={}; const td=new TextDecoder();
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nlen)); p+=46+nlen+xlen+clen;
    out[name]={method,csize,lho};
  }
  return { names:Object.keys(out), async text(name){ const e=out[name]; if(!e) return null;
      const lnl=dv.getUint16(e.lho+26,true), lxl=dv.getUint16(e.lho+28,true), start=e.lho+30+lnl+lxl, data=u8.slice(start,start+e.csize);
      if(e.method===0) return td.decode(data);
      const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(ds).text(); } };
}
async function readXLSX(buf){
  const z=await unzipEntries(buf), P=new DOMParser(), xml=async n=>{ const t=await z.text(n); return t?P.parseFromString(t,"application/xml"):null; };
  const ss=[]; const sst=await xml("xl/sharedStrings.xml"); if(sst) [...sst.getElementsByTagName("si")].forEach(si=>ss.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join("")));
  const wb=await xml("xl/workbook.xml"), rels=await xml("xl/_rels/workbook.xml.rels"); const relMap={};
  if(rels) [...rels.getElementsByTagName("Relationship")].forEach(r=>{ relMap[r.getAttribute("Id")]=r.getAttribute("Target"); });
  const sheets=[...(wb?wb.getElementsByTagName("sheet"):[])].map(s=>{ const rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"); let t=relMap[rid]||""; t=t.replace(/^\//,""); if(!t.startsWith("xl/")) t="xl/"+t; return {name:s.getAttribute("name"), path:t}; });
  const col=ref=>{ const m=/^([A-Z]+)/.exec(ref||""); let c=0; if(m) for(const ch of m[1]) c=c*26+ch.charCodeAt(0)-64; return c-1; };
  const result=[];
  for(const sh of sheets){ const doc=await xml(sh.path); if(!doc) continue; const rows=[];
    [...doc.getElementsByTagName("row")].forEach(r=>{ const row=[]; [...r.getElementsByTagName("c")].forEach(c=>{ const t=c.getAttribute("t"), v=c.getElementsByTagName("v")[0]; let val="";
        if(t==="s"&&v) val=ss[+v.textContent]||""; else if(t==="inlineStr") val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join(""); else if(v) val=t==="str"||t==="b"?v.textContent:(isFinite(+v.textContent)?+v.textContent:v.textContent);
        row[col(c.getAttribute("r"))]=val; }); rows.push(Array.from(row,x=>x??"")); });
    result.push({name:sh.name, rows}); }
  return result;
}

function parseCSV(text){ const sep=(text.split("\n")[0].match(/;/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?";":","; return text.split(/\r?\n/).map(line=>{ const out=[]; let cur="",q=false; for(const ch of line){ if(ch==='"'){ q=!q; } else if(ch===sep && !q){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out.map(x=>x.trim()); }); }

    const pi=r.findIndex(x=>/^(produkt|nazwa|skladnik|produkt nazwa)/.test(x)), gi=r.findIndex(x=>/ilosc|gram|\(g\)|^g$|waga|masa/.test(x)||x==="ilosc g");
    if(pi<0||gi<0) continue;
    const di=r.findIndex(x=>/^(dzien|data|date)/.test(x));
    const items=[]; for(const row of rows.slice(h+1)){ const name=String(row[pi]??"").trim(); const g=parseNum(row[gi]); if(!name||g==null||g<=0||/^suma|^razem|^total/i.test(fNorm(name))) continue; items.push({name, g, day:di>=0?String(row[di]??""):""}); }

async function importFile(file){

    else if(/\.xls$/i.test(file.name)){ throw new Error("Starszy format XLS nie jest obsługiwany. Wyeksportuj plik jako XLSX albo CSV."); }

      ${D.unmatched.slice(0,15).map((u,i)=>`<label class="f">${esc(u.name)} <span class="src">${fmt(u.g,0)} g</span><select data-map="${esc(u.name)}"><option value="">wybierz…</option>${FOODS.map(f=>f.name).filter((x,j,a)=>a.indexOf(x)===j).sort((a,b)=>a.localeCompare(b,"pl")).map(f=>`<option>${esc(f)}</option>`).join("")}</select></label>`).join("")}
      ${DW&&DW.items?`<button class="btn sec" data-act="dw-remap">Przelicz z przypisaniami</button>`:`<div class="src">Aby przypisać produkty, wczytaj plik ponownie.</div>`}</div>`:""}
    ${S.diet.salt==="no"?`<div class="note">Bez soli jodowanej łatwo o za mało jodu. Warto porozmawiać o tym z lekarzem lub dietetykiem.</div>`:""}
    ${S.diet.sun==="rare"?`<div class="note">Mało słońca latem zwiększa szansę na niski poziom witaminy D. Badanie 25(OH)D pokaże, jak jest naprawdę.</div>`:""}
    <div class="note"><b>Co dalej:</b> to przybliżenie, nie diagnoza. Wynik „poniżej normy” to sygnał, żeby najpierw zmienić dietę albo porozmawiać z dietetykiem, a nie od razu kupować suplement.</div>
    <div class="src">Skład żywności: USDA National Nutrient Database SR28, z poprawką na brak wzbogacania żywności w Polsce. Normy: NIZP PZH 2024.</div>
    <div class="btns"><button class="btn" data-act="dw-again">Sprawdź ponownie</button><button class="btn sec" data-act="close">Zamknij</button></div>`);
}
function dietCard(){
  const D=S.diet;
  if(!D) return `<button class="card howto diethero" data-act="diet"><div class="ruler" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="u"></i></div><div><div class="pname">Czy w ogóle potrzebuję suplementów?</div><div class="pmeta">Sprawdź swoją dietę: krótka ankieta albo plik z Fitatu. Wynik zostaje na telefonie.</div></div></button>`;

}

/* ============ Badania (tryb „Mam badania”) ============ */
// units: przelicznik z pierwszej (bazowej) jednostki: wartość_w_jednostce = wartość_bazowa × czynnik
const MARKERS = [
  { m:"d25",  name:"Witamina D (25(OH)D)", n:"d",   units:{"ng/ml":1,"nmol/l":2.496},
    note:"25(OH)D to najlepszy wskaźnik zapasów witaminy D. Latem skóra wytwarza ją pod wpływem słońca, więc wynik zmienia się z porą roku. Porównując dwa wyniki, pamiętaj, z jakiego miesiąca pochodzą." },
  { m:"ferr", name:"Ferrytyna",            n:"fe",  units:{"ng/ml":1,"µg/l":1},
    note:"Ferrytyna pokazuje zapasy żelaza. Infekcja albo stan zapalny mogą ją podnieść, dlatego lekarz ocenia ją razem z innymi badaniami (np. morfologią)." },
  { m:"fe",   name:"Żelazo w surowicy",    n:"fe",  units:{"µg/dl":1,"µmol/l":0.179},
    note:"Stężenie żelaza zmienia się w ciągu dnia i po posiłkach. Samo w sobie mówi niewiele, zwykle ocenia się je razem z ferrytyną." },
  { m:"b12",  name:"Witamina B12",         n:"b12", units:{"pg/ml":1,"pmol/l":0.738},
    note:"Wynik w dolnej części zakresu bywa niejednoznaczny. Lekarz może wtedy zlecić dodatkowe badanie." },
  { m:"fol",  name:"Kwas foliowy (foliany)", n:"fol", units:{"ng/ml":1,"nmol/l":2.266},
    note:"Stężenie folianów w surowicy w dużej mierze odzwierciedla to, co jadłeś w ostatnich dniach." },
  { m:"mg",   name:"Magnez w surowicy",    n:"mg",  units:{"mmol/l":1,"mg/dl":2.431},
    note:"We krwi jest ok. 1% magnezu z całego organizmu, a organizm utrzymuje jego stężenie w wąskim zakresie. Wynik w zakresie niewiele mówi o zapasach magnezu." },
  { m:"zn",   name:"Cynk",                 n:"zn",  units:{"µg/dl":1,"µmol/l":0.153},
    note:"Stężenie cynku we krwi słabo odzwierciedla jego zapasy i spada m.in. przy infekcji." },
  { m:"ca",   name:"Wapń całkowity",       n:"ca",  units:{"mmol/l":1,"mg/dl":4.008},
    note:"Organizm utrzymuje poziom wapnia we krwi bardzo stabilnie, więc wynik nie pokazuje, ile wapnia jest w diecie." },
  { m:"other", name:"Inny parametr", n:null, units:null }
];
const MK = Object.fromEntries(MARKERS.map(x=>[x.m,x]));
const LST = { low:{c:"warn",t:"Poniżej zakresu"}, in:{c:"ok",t:"W zakresie"}, high:{c:"bad",t:"Powyżej zakresu"}, none:{c:"none",t:"Bez zakresu"} };

function labName(l){ return l.m==="other" ? (l.name||"Inny parametr") : (MK[l.m]||{}).name || l.name || "Badanie"; }
function labKey(l){ return l.m==="other" ? "other:"+fNorm(l.name||"") : l.m; }
function labFlag(l){
  const has=l.lo!=null||l.hi!=null;
  if(has){ if(l.lo!=null && l.value<l.lo) return "low"; if(l.hi!=null && l.value>l.hi) return "high"; return "in"; }
  return l.flag||"none";
}
function rangeText(l){
  if(l.lo!=null && l.hi!=null) return `${fmt(l.lo,2)}–${fmt(l.hi,2)} ${l.unit}`;
  if(l.lo!=null) return `powyżej ${fmt(l.lo,2)} ${l.unit}`;
  if(l.hi!=null) return `poniżej ${fmt(l.hi,2)} ${l.unit}`;
  return "";
}
function convert(m,v,from,to){ if(from===to) return v; const u=(MK[m]||{}).units; if(!u||!u[from]||!u[to]) return null; return v/u[from]*u[to]; }
function labGroups(){
  const g={};
  for(const l of S.labs){ const k=labKey(l); (g[k]=g[k]||[]).push(l); }
  return Object.values(g).map(arr=>arr.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0))).sort((a,b)=>b[0].date.localeCompare(a[0].date));
}
function activeWith(n){ return n ? S.products.filter(p=>p.daily>0 && p.content[n]) : []; }
function ago(k){ const d=Math.round((parseKey(today())-parseKey(k))/864e5); if(d<=0) return "dziś"; if(d===1) return "wczoraj"; if(d<14) return `${d} dni temu`; if(d<60) return `${Math.round(d/7)} tyg. temu`; const mo=Math.round(d/30.4); return mo<12?`${mo} mies. temu`:`ponad rok temu`; }
function fullDate(k){ return parseKey(k).toLocaleDateString("pl-PL",{day:"numeric",month:"short",year:"numeric"}); }

/* --- alerty bezpieczeństwa (Badania + Dziś) --- */
function labAlerts(){
  const out=[];
  for(const arr of labGroups()){ const l=arr[0], mk=MK[l.m]||{}, f=labFlag(l), prods=activeWith(mk.n);
    if(f==="high" && prods.length) out.push({kind:"high",l,html:`<b>${esc(labName(l))}: wynik powyżej zakresu</b> (${esc(fullDate(l.date))}), a w Apteczce masz produkt z tym składnikiem: ${prods.map(p=>esc(p.name)).join(", ")}. Pokaż ten wynik lekarzowi, zanim przyjmiesz kolejne dawki.`});
    else if(f==="low") out.push({kind:"low",l,html:`<b>${esc(labName(l))}: wynik poniżej zakresu</b> (${esc(fullDate(l.date))}). Taki wynik warto omówić z lekarzem: przyczyną nie zawsze jest dieta, a dawkę dobiera lekarz.`});
  }
  return out;
}
function todayLabAlert(){
  const a=labAlerts().filter(x=>x.kind==="high"); if(!a.length) return "";
  return a.map(x=>`<div class="note warn" role="alert">${x.html} <button class="link" data-act="go-labs">Badania</button></div>`).join("");
}

/* --- widok --- */
function viewLabs(){
  const groups=labGroups(), alerts=labAlerts();
  return `<section class="screen">
  <div class="head"><div><div class="sub">Wyniki z laboratorium</div><h1>Badania</h1></div><button class="btn" data-act="lab-add">Dodaj</button></div>
  ${!groups.length?`<div class="card empty"><div class="pname" style="color:var(--ink)">Przepisz wynik z wydruku</div>
    <div style="margin-top:6px">Wybierz badanie, wpisz wynik, jednostkę i zakres referencyjny z wydruku. Wassup pokaże, czy wynik jest w tym zakresie, i zapamięta go, żeby porównać z kolejnym badaniem.</div>
    <button class="btn" style="margin-top:14px" data-act="lab-add">Dodaj wynik</button></div>`:""}
  ${alerts.map(x=>`<div class="note ${x.kind==="high"?"warn":""}">${x.html}</div>`).join("")}
  ${groups.map(labCard).join("")}
  <p class="src" style="padding:0 4px">Wassup porównuje wynik tylko z zakresem z Twojego wydruku. Nie stawia diagnozy i nie dobiera dawek: o tym decyduje lekarz. Laboratoria mają różne zakresy i jednostki, dlatego zawsze przepisuj zakres z tego samego wydruku.</p>
  </section>`;
}
function labCard(arr){
  const l=arr[0], f=labFlag(l), st=LST[f], prev=arr[1];
  let delta="";
  if(prev){ const pv=convert(l.m,prev.value,prev.unit,l.unit); if(pv!=null){ const d=l.value-pv; delta=`<div class="pmeta">Poprzednio ${fmt(pv,2)} ${esc(l.unit)} (${esc(fullDate(prev.date))}) · zmiana ${d>0?"+":d<0?"−":"±"}${fmt(Math.abs(d),2)} ${esc(l.unit)}</div>`; } }
  const old=(parseKey(today())-parseKey(l.date))/864e5>183;
  return `<button class="card labcard" data-act="lab-open" data-k="${esc(labKey(l))}" aria-label="${esc(labName(l))}: szczegóły">
    <div class="ntop"><div><div class="nname">${l.m!=="other"&&MK[l.m].n?sym(MK[l.m].n):""}${esc(labName(l))}</div>
      <div style="margin-top:8px" class="big num">${fmt(l.value,2)}<small>${esc(l.unit)}</small></div>
      <div class="pmeta">${esc(fullDate(l.date))} · ${ago(l.date)}${old?" · wynik ma ponad pół roku":""}</div></div>
      <span class="chip ${st.c}">${st.t}</span></div>
    ${rangeBar(l)}
    ${arr.length>1?trendSVG(arr):""}
    ${delta}
  </button>`;
}
function rangeBar(l){
  if(l.lo==null && l.hi==null) return `<div class="pmeta">${l.flag&&l.flag!=="none"?"Oznaczenie przepisane z wydruku (bez liczbowego zakresu).":"Bez zakresu z wydruku. Dopisz go, żeby zobaczyć wynik na tle zakresu."}</div>`;
  const top=Math.max((l.hi!=null?l.hi:l.lo)*1.35, l.value*1.12, l.lo!=null?l.lo*1.6:0);
  const p=x=>Math.max(0,Math.min(100,x/top*100));
  const a=l.lo!=null?p(l.lo):0, b=l.hi!=null?p(l.hi):100, v=p(l.value), f=labFlag(l);
  return `<div class="rbar" role="img" aria-label="Wynik ${fmt(l.value,2)} ${esc(l.unit)}, zakres z wydruku ${esc(rangeText(l))}">
    <div class="rtrack"></div><div class="rband" style="left:${a}%;width:${b-a}%"></div>
    <i class="rdot ${f}" style="left:${v}%"></i>
    ${l.lo!=null?`<span class="rlab" style="left:${a}%">${fmt(l.lo,2)}</span>`:""}${l.hi!=null?`<span class="rlab" style="left:${b}%">${fmt(l.hi,2)}</span>`:""}
  </div><div class="pmeta">Zakres z wydruku: ${esc(rangeText(l))}</div>`;
}
function trendSVG(arr){
  const unit=arr[0].unit, pts=arr.slice().reverse().map(x=>({d:x.date,v:convert(x.m,x.value,x.unit,unit),f:labFlag(x)})).filter(x=>x.v!=null);
  if(pts.length<2) return "";
  const l=arr[0], W=320,H=120,L=8,R=8,T=12,B=22,pw=W-L-R,ph=H-T-B;
  const pv=pts.map(p=>p.v), pmax=Math.max(...pv), vals=pv.concat([l.lo,l.hi].filter(x=>x!=null && x<=pmax*1.6));
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo||hi||1)*0.18; lo=Math.max(0,lo-pad); hi=hi+pad;
  const t0=parseKey(pts[0].d).getTime(), t1=parseKey(pts[pts.length-1].d).getTime(), span=Math.max(1,t1-t0);
  const x=d=>L+(parseKey(d).getTime()-t0)/span*pw, y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  let s=`<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wyniki w czasie: ${pts.map(p=>fmt(p.v,2)+" "+unit+" ("+fullDate(p.d)+")").join(", ")}">`;
  if(l.lo!=null||l.hi!=null){ const ya=y(l.hi!=null?Math.min(l.hi,hi):hi), yb=y(l.lo!=null?Math.max(l.lo,lo):lo); s+=`<rect x="${L}" y="${ya}" width="${pw}" height="${Math.max(0,yb-ya)}" fill="var(--ok)" opacity=".13" rx="4"/>`; }
  s+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${pts.map(p=>x(p.d)+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{ const cx=x(p.d), cy=y(p.v), last=i===pts.length-1;
    s+=`<circle cx="${cx}" cy="${cy}" r="${last?5:4}" class="tdot ${p.f}"/>`;
    s+=`<text x="${cx}" y="${cy-9}" text-anchor="${i===0?"start":last?"end":"middle"}" font-size="10.5" font-weight="${last?700:500}" fill="var(--ink)">${fmt(p.v,1)}</text>`;
    if(i===0||last) s+=`<text x="${cx}" y="${H-6}" text-anchor="${i===0?"start":"end"}" font-size="10" fill="var(--muted)">${esc(shortDate(p.d))} ${String(parseKey(p.d).getFullYear()).slice(2)}</text>`; });
  return s+"</svg>";
}

/* --- arkusz szczegółów --- */
function labDetail(k){
  const arr=labGroups().find(a=>labKey(a[0])===k); if(!arr) return;
  const l=arr[0], mk=MK[l.m]||{}, n=mk.n, prods=activeWith(n);
  sheet(labName(l),`
    ${mk.note?`<div class="note">${esc(mk.note)}</div>`:""}
    <div class="pname">Wszystkie wyniki</div>
    <div class="list">${arr.map(x=>{ const st=LST[labFlag(x)]; return `<button class="row" style="width:100%;text-align:left" data-act="lab-edit" data-id="${x.id}">
      <div class="grow"><div class="pname num">${fmt(x.value,2)} ${esc(x.unit)}</div><div class="pmeta">${esc(fullDate(x.date))}${rangeText(x)?" · zakres "+esc(rangeText(x)):""}</div></div>
      <span class="chip ${st.c}">${st.t}</span></button>`; }).join("")}</div>
    ${n?`<div class="pname">Z czym to się łączy w Wassup</div>
      <div class="cmp">
        <div><span>W Apteczce z tym składnikiem</span><span>${prods.length?prods.map(p=>esc(p.name)).join(", "):"nic"}</span></div>
        ${S.diet&&!NOT_FROM_DIET[n]&&S.diet.intake[n]?`<div><span>Z diety (szacunek)</span><span class="num">ok. ${fmt(S.diet.intake[n],0)} ${NUTR[n].unit}/dzień</span></div>`:""}
      </div>
      ${SOURCES[n]?`<div class="pmeta"><b>Źródła w diecie:</b> ${esc(SOURCES[n])}.</div>`:NOT_FROM_DIET[n]?`<div class="pmeta">${esc(NOT_FROM_DIET[n])}</div>`:""}`:""}
    <button class="btn full" data-act="lab-add" data-k="${esc(l.m)}">Dodaj nowszy wynik</button>
    <p class="src">Wassup nie interpretuje wyników. Co dalej z suplementacją, ustal z lekarzem.</p>`);
}

/* --- formularz wyniku --- */
let LF=null;
function labForm(id,preset){
  const e=id?S.labs.find(x=>x.id===id):null;
  if(e) LF={id:e.id,m:e.m,name:e.name||"",date:e.date,value:String(e.value).replace(".",","),unit:e.unit,lo:e.lo!=null?String(e.lo).replace(".",","):"",hi:e.hi!=null?String(e.hi).replace(".",","):"",flag:e.flag||"none"};
  else { const m=preset&&MK[preset]?preset:"d25"; LF={id:null,m,name:"",date:today(),value:"",unit:"",lo:"",hi:"",flag:"none"}; prefillRange(); }
  labSheet();
}
function prefillRange(){
  const mk=MK[LF.m]; if(mk.units && !mk.units[LF.unit]) LF.unit=Object.keys(mk.units)[0];
  if(LF.id) return;
  const prev=S.labs.filter(x=>x.m===LF.m && (LF.m!=="other") && x.unit===LF.unit && (x.lo!=null||x.hi!=null)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  LF.lo=prev&&prev.lo!=null?String(prev.lo).replace(".",","):""; LF.hi=prev&&prev.hi!=null?String(prev.hi).replace(".",","):""; LF.prefilled=!!prev;
}
function readLF(){ const g=id=>{ const el=document.getElementById(id); return el?el.value:null; };
  for(const [k,id] of [["m","lf-m"],["name","lf-name"],["date","lf-date"],["value","lf-val"],["unit","lf-unit"],["lo","lf-lo"],["hi","lf-hi"]]){ const v=g(id); if(v!=null) LF[k]=v; } }
function lfPreview(){
  const v=parseNum(LF.value), lo=parseNum(LF.lo), hi=parseNum(LF.hi);
  if(lo==null && hi==null) return `<div class="pname">Jak laboratorium oznaczyło wynik?</div>
    <div class="pmeta">Jeśli na wydruku nie ma zakresu, przepisz oznaczenie (np. „L”, „H”, strzałka albo pogrubienie).</div>
    <div class="seg" role="group" aria-label="Oznaczenie z wydruku">${[["low","Poniżej"],["in","W normie"],["high","Powyżej"],["none","Brak"]].map(([f,t])=>`<button data-lf-flag="${f}" class="${LF.flag===f?"on":""}">${t}</button>`).join("")}</div>`;
  if(v==null) return `<div class="pmeta">Wpisz wynik, a zobaczysz go na tle zakresu.</div>`;
  if(lo!=null && hi!=null && lo>=hi) return `<div class="pmeta" style="color:var(--bad)">Dolna granica musi być mniejsza od górnej.</div>`;
  const st=LST[labFlag({value:v,lo,hi})];
  return `<div class="lfprev"><span>Według zakresu z wydruku:</span><span class="chip ${st.c}">${st.t}</span></div>`;
}
function labSheet(){
  const mk=MK[LF.m], units=mk.units?Object.keys(mk.units):null, bio=activeWith("bio");
  sheet(LF.id?"Edytuj wynik":"Dodaj wynik",`
    <label class="f">Badanie<select id="lf-m">${MARKERS.map(x=>`<option value="${x.m}" ${x.m===LF.m?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
    ${LF.m==="other"?`<label class="f">Nazwa badania<input id="lf-name" value="${esc(LF.name)}" placeholder="np. Selen" autocomplete="off"></label>`:""}
    <div class="f-row"><label class="f">Data badania<input id="lf-date" type="date" max="${today()}" value="${esc(LF.date)}"></label>
      <label class="f">Wynik<input id="lf-val" inputmode="decimal" value="${esc(LF.value)}" placeholder="z wydruku"></label></div>
    <label class="f">Jednostka${units?`<select id="lf-unit">${units.map(u=>`<option ${u===LF.unit?"selected":""}>${u}</option>`).join("")}</select>`:`<input id="lf-unit" value="${esc(LF.unit)}" placeholder="np. µg/l" autocomplete="off">`}</label>
    <div class="fieldset"><div class="pname">Zakres referencyjny z wydruku</div>
      <div class="pmeta">Przepisz z kolumny „Zakres referencyjny”, „Wartości prawidłowe” albo „Norma”. Jeśli jest tylko jedna granica (np. „&gt; 30”), wpisz tylko ją.${LF.prefilled?" Uzupełniliśmy go z Twojego poprzedniego wyniku: sprawdź, czy się zgadza.":""}</div>
      <div class="f-row"><label class="f">Od<input id="lf-lo" inputmode="decimal" value="${esc(LF.lo)}"></label><label class="f">Do<input id="lf-hi" inputmode="decimal" value="${esc(LF.hi)}"></label></div>
      <div id="lf-prev">${lfPreview()}</div></div>
    ${bio.length?`<div class="note">${esc(NUTR.bio.warn)}</div>`:""}
    <button class="btn full" data-act="lab-save">Zapisz</button>
    ${LF.id?`<button class="btn danger full" data-act="lab-del" data-id="${LF.id}">Usuń ten wynik</button>`:""}
    <p class="src">Wassup porównuje wynik z zakresem, który wpiszesz. Nie podpowiada zakresów, bo każde laboratorium ma własne.</p>`);
}
function labSave(){
  readLF();
  const v=parseNum(LF.value), lo=parseNum(LF.lo), hi=parseNum(LF.hi), unit=(LF.unit||"").trim(), name=(LF.name||"").trim();
  if(LF.m==="other" && !name){ toast("Wpisz nazwę badania"); return false; }
  if(!LF.date){ toast("Podaj datę badania"); return false; }
  if(LF.date>today()){ toast("Data badania nie może być z przyszłości"); return false; }
  if(v==null || v<0){ toast("Wpisz wynik z wydruku"); return false; }
  if(!unit){ toast("Podaj jednostkę"); return false; }
  if(lo!=null && hi!=null && lo>=hi){ toast("Dolna granica zakresu musi być mniejsza od górnej"); return false; }
  let e=LF.id?S.labs.find(x=>x.id===LF.id):null; if(!e){ e={id:uid(),ts:Date.now()}; S.labs.push(e); }
  Object.assign(e,{ m:LF.m, n:(MK[LF.m]||{}).n||null, name:LF.m==="other"?name:undefined, date:LF.date, value:v, unit, lo, hi, flag:(lo==null&&hi==null)?LF.flag:undefined });
  S.prefs.labsMode=true; save(); return true;
}
function labsMigrate(s){
  (s.labs||[]).forEach(l=>{ if(!l.id) l.id=uid(); if(!l.m) l.m = l.n==="d"?"d25":"other"; if(l.lo===undefined) l.lo=null; if(l.hi===undefined) l.hi=null; });
  if(s.labs && s.labs.length && s.prefs && s.prefs.labsMode==null) s.prefs.labsMode=true;
}

/* ============ Akcje ============ */
function num(id){ const el=document.getElementById(id); if(!el) return null; return parseNum(el.value); }
function parseNum(s){ const v=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isFinite(v)?v:null; }
function fromCatalog(cid){ const c=CATALOG.find(x=>x.cid===cid); return { id:uid(), cid:c.cid, name:c.name, brand:c.brand, type:c.type, unit:c.unit, content:{...c.content}, form:c.form, daily:1, producerDaily:c.producerDaily, info:c.info, stock:null }; }
let toastT;
function toast(msg){ clearTimeout(toastT); let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; toastT=setTimeout(()=>t.remove(),2600); }
function takenToday(p){ return taken(today(),p.id); }

document.addEventListener("click", async e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ TAB=tab.dataset.tab; if(TAB==="today") DAY=today(); render(); window.scrollTo(0,0); return; }
  const sx=e.target.closest("[data-ob-sex]"); if(sx){ OB.sex=sx.dataset.obSex; render(); return; }
  const pk=e.target.closest("[data-ob-pick]"); if(pk){ OB.pick[pk.dataset.obPick]=!OB.pick[pk.dataset.obPick]; render(); return; }
  const lff=e.target.closest("[data-lf-flag]"); if(lff){ readLF(); LF.flag=lff.dataset.lfFlag; document.getElementById("lf-prev").innerHTML=lfPreview(); return; }
  const ms=e.target.closest("[data-sex]"); if(ms){ S.profile.sex=ms.dataset.sex; if(S.profile.sex==="m") S.profile.state="none"; save(); render(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-bg"){ if(e.target===a) closeSheet(); return; }
  if(act==="close"){ closeSheet(); return; }
  if(act==="info"){ infoSheet(a.dataset.k); return; }
  if(act==="diet"||act==="dw-again"){ dietStart(); return; }
  if(act==="diet-show"){ dietResultSheet(); return; }
  if(act==="dw-next"){ DW.goal=document.getElementById("dw-goal").value; DW.step=2; dietSheet(); return; }
  if(act==="dw-ffq"){ DW.step=3; dietSheet(); return; }
  if(act==="dw-import"){ document.getElementById("dw-file").click(); return; }
  if(act==="dw-calc"){ readFFQ(); saveDiet("ffq", ffqIntake(DW.ans)); return; }
  if(act==="dw-remap"){ document.querySelectorAll("[data-map]").forEach(el=>{ if(el.value) S.foodMap[fNorm(el.dataset.map)]=el.value; }); save(); computeImport(); toast("Przeliczono"); return; }
  if(act==="pack"){ packSheet(id); return; }
  if(act==="pack-save"||act==="goal-save"||act==="goal-plan"){
    const items = act==="pack-save" ? [...document.querySelectorAll("[data-goal]")].map(el=>[el.dataset.goal, el.value.trim()]) : [[a.dataset.n, act==="goal-plan"?String(planned()[a.dataset.n]):document.getElementById("g-val").value.trim()]];
    const warns=[];
    for(const [n,raw] of items){ if(raw===""){ continue; } const v=parseNum(raw), c=checkGoal(n,v); if(c.err){ toast(c.err); return; } if(c.warn) warns.push(c.warn); }
    for(const [n,raw] of items){ if(raw===""){ if(act==="pack-save") delete S.goals[n]; continue; } S.goals[n]=Math.round(parseNum(raw)*1000)/1000; }
    if(act==="pack-save" && !S.packs.includes(id)) S.packs.push(id);
    save(); closeSheet(); render(); toast(warns.length?warns[0]:"Zapisano cel"); return; }
  if(act==="goal-del"){ delete S.goals[a.dataset.n]; save(); render(); toast("Usunięto cel"); return; }
  if(act==="pack-off"){ S.packs=S.packs.filter(x=>x!==id); save(); closeSheet(); render(); toast("Pakiet wyłączony. Cele zostały, usuniesz je w Wiedzy."); return; }
  if(act==="ob-done"){ S.profile={sex:OB.sex, age:(document.getElementById("ob-age")||{}).value||OB.age, state:OB.sex==="f"?((document.getElementById("ob-state")||{}).value||"none"):"none"}; S.created=today();
    S.products=CATALOG.filter(c=>OB.pick[c.cid]).map(c=>fromCatalog(c.cid)); save(); TAB="today"; render(); return; }
  if(act==="day-prev"){ DAY=addDays(DAY,-1); render(); return; }
  if(act==="day-next"){ if(DAY<today()) DAY=addDays(DAY,1); render(); return; }
  if(act==="toggle"){ const p=S.products.find(x=>x.id===id); S.log[DAY]=S.log[DAY]||{}; const cur=S.log[DAY][id]||0; S.log[DAY][id]=cur>=p.daily?0:p.daily; if(!S.log[DAY][id]) delete S.log[DAY][id]; if(!Object.keys(S.log[DAY]).length) delete S.log[DAY]; save(); render(); try{ navigator.vibrate&&navigator.vibrate(10); }catch(_){} return; }
  if(act==="qty"){ qtySheet(id); return; }
  if(act==="q-"||act==="q+"){ QTY.u=Math.max(0,Math.min(10,QTY.u+(act==="q+"?1:-1))); const p=S.products.find(x=>x.id===QTY.id); document.getElementById("qv").textContent=QTY.u; document.getElementById("qd").textContent=doseText(p,QTY.u)||"0"; return; }
  if(act==="q-save"){ S.log[DAY]=S.log[DAY]||{}; if(QTY.u) S.log[DAY][QTY.id]=QTY.u; else delete S.log[DAY][QTY.id]; if(!Object.keys(S.log[DAY]).length) delete S.log[DAY]; save(); closeSheet(); render(); return; }
  if(act==="add"){ productSheet(null); return; }
  if(act==="edit"){ productSheet(id); return; }
  if(act==="row-add"){ FORM.rows.push({n:"",amt:"",u:""}); document.getElementById("rows").innerHTML=rowsHTML(); return; }
  if(act==="row-del"){ FORM.rows.splice(+a.dataset.i,1); if(!FORM.rows.length) FORM.rows.push({n:"",amt:"",u:""}); document.getElementById("rows").innerHTML=rowsHTML(); return; }
  if(act==="cat-add"){ S.products.push(fromCatalog(a.dataset.cid)); save(); closeSheet(); render(); toast("Dodano do Apteczki"); return; }
  if(act==="p-save"){
    const name=(document.getElementById("p-name").value||"").trim(); if(!name){ toast("Wpisz nazwę produktu"); return; }
    const content={};
    for(const r of FORM.rows){ if(!r.n) continue; let v=parseNum(r.amt); if(v==null||v<=0) continue; if(r.n==="d" && r.u==="IU") v=v/40; content[r.n]=Math.round(v*1000)/1000; }
    if(!Object.keys(content).length){ toast("Wybierz składnik i wpisz jego ilość"); return; }
    let p=id?S.products.find(x=>x.id===id):null; if(!p){ p={id:uid(),stock:null}; S.products.push(p); }
    Object.assign(p,{ name, brand:document.getElementById("p-brand").value.trim(), type:document.getElementById("p-type").value, unit:document.getElementById("p-unit").value, content, form:document.getElementById("p-form").value.trim(), daily:num("p-daily")||1, producerDaily:num("p-prod")||null });
    const st=num("p-stock"); if(st!=null) p.stock={count:st+takenToday(p), since:today()};
    save(); closeSheet(); render(); toast("Zapisano"); return; }
  if(act==="p-del"){ S.products=S.products.filter(x=>x.id!==id); save(); closeSheet(); render(); toast("Usunięto z Apteczki"); return; }
  if(act==="refill"){ const p=S.products.find(x=>x.id===id); const c=CATALOG.find(x=>x.cid===p.cid); const left=stockLeft(p)||0; const add=(c&&c.pack)||30; p.stock={count:left+add+takenToday(p), since:today()}; save(); render(); toast(`Dodano ${add} ${unitWord(p,add)}. Liczbę zmienisz w Edytuj.`); return; }
  if(act==="lab"||act==="lab-add"){ closeSheet(); labForm(null,a.dataset.k); return; }
  if(act==="lab-open"){ labDetail(a.dataset.k); return; }
  if(act==="lab-edit"){ closeSheet(); labForm(id); return; }
  if(act==="lab-save"){ const wasOff=TAB!=="labs"; if(labSave()){ closeSheet(); render(); toast(wasOff?"Zapisano. Wynik znajdziesz w zakładce Badania":"Zapisano wynik"); } return; }
  if(act==="lab-del"){ S.labs=S.labs.filter(x=>x.id!==id); save(); closeSheet(); render(); toast("Usunięto wynik"); return; }
  if(act==="go-labs"){ S.prefs.labsMode=true; save(); TAB="labs"; render(); window.scrollTo(0,0); return; }
  if(act==="reminder"){ const t=document.getElementById("rem-time").value; window.location.href=`reminders/przypomnienie-${t}.ics`; return; }
  if(act==="export"){ await exportData(); return; }
  if(act==="import"){ document.getElementById("import-file").click(); return; }
  if(act==="wipe"){ wipeSheet(); return; }
  if(act==="wipe-yes"){ S=blank(); save(); closeSheet(); TAB="today"; render(); return; }
});
async function exportData(){
  const name=`wassup-kopia-${today()}.json`, blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  try{ const file=new File([blob],name,{type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Kopia Wassup"}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.row!=null){ const r=FORM.rows[+el.dataset.row]; r[el.dataset.k]=el.value; if(el.dataset.k==="n"){ r.u=el.value?NUTR[el.value].unit:""; document.getElementById("rows").innerHTML=rowsHTML(); } return; }
  if(el.dataset && el.dataset.risk){ DW.risk[el.dataset.risk]=el.checked; return; }
  if(el.id==="dw-file"){ const f=el.files[0]; if(f) importFile(f); return; }
  if(el.id==="lf-m"){ readLF(); LF.m=el.value; LF.unit=""; prefillRange(); labSheet(); return; }
  if(el.id==="lf-unit" && el.tagName==="SELECT"){ readLF(); if(!LF.lo&&!LF.hi) prefillRange(); else LF.prefilled=false; labSheet(); return; }
  if(el.id==="labs-mode"){ S.prefs.labsMode=el.checked; save(); render(); toast(el.checked?"Dodano zakładkę Badania":"Ukryto zakładkę Badania. Wyniki zostały zapisane."); return; }
  if(el.id==="only-left"){ S.prefs.onlyLeft=el.checked; save(); render(); return; }
  if(el.id==="hist-n"||el.id==="know-n"){ KNOW=el.value; render(); return; }
  if(el.id==="me-age"){ S.profile.age=el.value; save(); render(); }
  if(el.id==="me-state"){ S.profile.state=el.value; save(); render(); }
  if(el.id==="ob-age"){ OB.age=el.value; }
  if(el.id==="ob-state"){ OB.state=el.value; }
  if(el.id==="import-file"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||d.v!==1||!Array.isArray(d.products)) throw 0; S=fill(d); save(); render(); toast("Wczytano kopię"); }catch(_){ toast("To nie jest plik kopii Wassup"); } }; r.readAsText(f); }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.row!=null && el.dataset.k==="amt"){ FORM.rows[+el.dataset.row].amt=el.value; return; }
  if(el.id==="lf-val"||el.id==="lf-lo"||el.id==="lf-hi"){ readLF(); document.getElementById("lf-prev").innerHTML=lfPreview(); return; }
  if(el.id==="iu"){ const v=parseNum(el.value); document.getElementById("ug").value=v!=null?fmt(v/40,2):""; }
  if(el.id==="ug"){ const v=parseNum(el.value); document.getElementById("iu").value=v!=null?String(Math.round(v*40)):""; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && document.querySelector(".sheet")) closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && TAB==="today" && DAY!==today()){ DAY=today(); render(); } });

render();
if("serviceWorker" in navigator && location.protocol==="https:" && /github\.io$/.test(location.hostname)){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }

</script>
