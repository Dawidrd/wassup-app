<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wassup</title>
<meta name="description" content="Wassup: suplementy, które rozumiesz. Tracker magnezu i witaminy D.">
<meta name="theme-color" content="#0E1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wassup">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS-native shell (large title, scroll body, 5-tab bar); nutrient identity = capsule colours (Mg teal, D amber, B6 violet), text always in ink */
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#111915; --muted:#5E6B66; --faint:#8A9691; --line:#E1E6E4; --fill:#EAEFED;
  --brand:#0E5C4C; --brand-ink:#FFFFFF;
  --mg:#1baf7a; --d:#eda100; --b6:#4a3aa7;
  --ok:#1E7A4C; --ok-bg:#E2F2E9; --warn:#8A5A00; --warn-bg:#FBEFD2; --bad:#B3261E; --bad-bg:#FBE3E1;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --tab-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B100E; --card:#161D1A; --ink:#E8EEEB; --muted:#9BA9A3; --faint:#6F7D77; --line:#26302C; --fill:#1E2723;
  --brand:#5FC3A5; --brand-ink:#08130F;
  --mg:#199e70; --d:#c98500; --b6:#9085e9;
  --ok:#6FD3A0; --ok-bg:#163126; --warn:#F2C05A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A18;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B100E; --card:#161D1A; --ink:#E8EEEB; --muted:#9BA9A3; --faint:#6F7D77; --line:#26302C; --fill:#1E2723;
  --brand:#5FC3A5; --brand-ink:#08130F;
  --mg:#199e70; --d:#c98500; --b6:#9085e9;
  --ok:#6FD3A0; --ok-bg:#163126; --warn:#F2C05A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1A18;
  color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
main{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px);max-width:560px;margin:0 auto}
.screen{display:grid;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.head h1{font-family:var(--f-round);font-size:34px;line-height:1.05;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.section-t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 4px -8px}
.card{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:12px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.dots{display:flex;gap:4px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.mg{background:var(--mg)}.dot.d{background:var(--d)}.dot.b6{background:var(--b6)}
.pname{font-weight:600}
.pmeta{font-size:13px;color:var(--muted)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:background .15s,border-color .15s}
.check svg{width:22px;height:22px;opacity:0}
.check.on{background:var(--brand);border-color:var(--brand)}
.check.on svg{opacity:1;color:var(--brand-ink)}
.count{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px;background:var(--fill);flex-shrink:0}
.datenav{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.none{background:var(--fill);color:var(--muted)}
.ntop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nname{display:flex;align-items:center;gap:8px;font-weight:600}
.big{font-family:var(--f-round);font-size:34px;font-weight:700;line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
.alt{font-size:14px;color:var(--muted)}
.scale{position:relative;height:44px;margin:4px 2px 0}
.track{position:absolute;left:0;right:0;top:8px;height:10px;border-radius:5px;background:var(--fill)}
.fillbar{position:absolute;left:0;top:8px;height:10px;border-radius:5px}
.mark{position:absolute;top:2px;width:2px;height:22px;background:var(--ink);opacity:.55;border-radius:1px}
.mark.ul{background:var(--bad);opacity:.9}
.mlabel{position:absolute;top:26px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.cmp{display:grid;gap:0;border-top:1px solid var(--line)}
.cmp div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp div:last-child{border-bottom:0}
.cmp span:last-child{text-align:right;color:var(--muted);flex-shrink:0}
.note{font-size:13.5px;color:var(--muted);background:var(--fill);border-radius:12px;padding:10px 12px}
.note.warn{background:var(--warn-bg);color:var(--ink)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.f input,.f select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-row>*{min-width:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-round);font-size:24px}
.stat span{font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .sel{font-size:14px;color:var(--muted);min-height:20px}
.claims{margin:0;padding-left:18px;font-size:14.5px}
.claims li{margin:6px 0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 14px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.src{font-size:12px;color:var(--faint)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--muted)}
.pill.lek{background:var(--warn-bg);color:var(--warn)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;height:var(--tab-h)}
.tab{display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;color:var(--faint)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:14px}
.sheet h2{font-family:var(--f-round);font-size:24px;margin:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--fill);font-size:24px;font-weight:600}
.stepper b{font-family:var(--f-round);font-size:40px;min-width:60px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.cal span.full{background:var(--brand);color:var(--brand-ink)}
.cal span.part{background:color-mix(in srgb,var(--brand) 35%,var(--fill))}
.cal span.future{opacity:.3}
.cal span.today{outline:2px solid var(--ink);outline-offset:-2px}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="tabbar"><nav id="tabs" aria-label="Nawigacja"></nav></div>
<div id="overlay"></div>

<script>
"use strict";
/* ============ Dane referencyjne (źródła: baza regulacyjna Wassup) ============ */
const APP_VERSION = "0.1.0";
const NUTR = {
  mg: { name:"Magnez", unit:"mg", rws:375, gis:400, ul:250,
        ulNote:"UL magnezu (250 mg) dotyczy tylko magnezu z suplementów, wody i żywności wzbogacanej, nie z jedzenia.",
        claims:["Magnez przyczynia się do zmniejszenia uczucia zmęczenia i znużenia","Magnez pomaga w utrzymaniu równowagi elektrolitowej","Magnez przyczynia się do utrzymania prawidłowego metabolizmu energetycznego","Magnez pomaga w prawidłowym funkcjonowaniu układu nerwowego","Magnez pomaga w prawidłowym funkcjonowaniu mięśni","Magnez pomaga w prawidłowej syntezie białka","Magnez pomaga w utrzymaniu prawidłowych funkcji psychologicznych","Magnez pomaga w utrzymaniu zdrowych kości","Magnez pomaga w utrzymaniu zdrowych zębów","Magnez odgrywa rolę w procesie podziału komórek"] },
  d:  { name:"Witamina D", unit:"µg", rws:5, gis:50, ul:100, iu:40,
        ulNote:"UL witaminy D (100 µg = 4000 IU) obejmuje dietę i suplementy razem. Synteza w skórze ze słońca się do niego nie wlicza.",
        claims:["Witamina D pomaga w prawidłowym wchłanianiu/wykorzystywaniu wapnia i fosforu","Witamina D pomaga w utrzymaniu prawidłowego poziomu wapnia we krwi","Witamina D pomaga w utrzymaniu zdrowych kości","Witamina D pomaga w prawidłowym funkcjonowaniu mięśni","Witamina D pomaga w utrzymaniu zdrowych zębów","Witamina D pomaga w prawidłowym funkcjonowaniu układu odpornościowego","Witamina D bierze udział w procesie podziału komórek"] },
  b6: { name:"Witamina B6", unit:"mg", rws:1.4, gis:6, ul:12,
        ulNote:"UL witaminy B6 (12 mg) obejmuje wszystkie źródła.",
        claims:["Witamina B6 przyczynia się do zmniejszenia uczucia zmęczenia i znużenia","Witamina B6 pomaga w prawidłowym funkcjonowaniu układu nerwowego","Witamina B6 pomaga w utrzymaniu prawidłowych funkcji psychologicznych","Witamina B6 przyczynia się do utrzymania prawidłowego metabolizmu energetycznego","Witamina B6 pomaga w prawidłowym funkcjonowaniu układu odpornościowego","Witamina B6 pomaga w prawidłowej produkcji czerwonych krwinek","Witamina B6 przyczynia się do regulacji aktywności hormonalnej"] }
};
const ORDER = ["mg","d","b6"];
// Normy żywienia dla populacji Polski 2024 (RDA; wit. D: AI)
const NORMS = {
  m: { "19-30":{mg:400,d:15,b6:1.3}, "31-50":{mg:420,d:15,b6:1.3}, "51-65":{mg:420,d:15,b6:1.7}, "66-75":{mg:420,d:15,b6:1.7}, "75+":{mg:420,d:15,b6:1.7} },
  f: { "19-30":{mg:310,d:15,b6:1.3}, "31-50":{mg:320,d:15,b6:1.3}, "51-65":{mg:320,d:15,b6:1.5}, "66-75":{mg:320,d:15,b6:1.5}, "75+":{mg:320,d:15,b6:1.5} },
  preg:{mg:360,d:15,b6:1.9}, lact:{mg:320,d:15,b6:2.0}
};
const AGES = ["19-30","31-50","51-65","66-75","75+"];
const UNITS = { kapsulka:["kapsułka","kapsułki","kapsułek","kapsułce"], tabletka:["tabletka","tabletki","tabletek","tabletce"], kropla:["kropla","krople","kropli","kropli"], saszetka:["saszetka","saszetki","saszetek","saszetce"], porcja:["porcja","porcje","porcji","porcji"] };
const SHORT = { mg:"Mg", d:"wit. D", b6:"B6" };
const CATALOG = [
  { cid:"allnutrition-magb6", name:"MAG B6", brand:"Allnutrition", type:"suplement", unit:"kapsulka", content:{mg:102,b6:0.7},
    form:"cytrynian magnezu (670 mg w kapsułce)", producerDaily:2, pack:30,
    info:"Na opakowaniu „670 mg” to masa całego cytrynianu magnezu. Samego magnezu jest 102 mg (27% RWS). Producent zaleca 2 kapsułki dziennie." },
  { cid:"ibuvit-d3-4000", name:"Ibuvit D3 4000 IU", brand:"Polpharma", type:"lek", unit:"kapsulka", content:{d:100},
    form:"cholekalcyferol", producerDaily:1, pack:60,
    info:"Lek bez recepty, nie suplement, więc limit GIS dla suplementów go nie dotyczy. Wskazanie z ulotki: zapobieganie niedoborowi witaminy D u dorosłych z otyłością (BMI ≥ 30), zwykle od października do kwietnia. Nie łączyć z innymi produktami z witaminą D bez konsultacji." }
];

/* ============ Stan i zapis ============ */
const KEY = "wassup.v1";
let S = load();
function blank(){ return { v:1, profile:null, products:[], log:{}, labs:[], created:today() }; }
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); if(s && s.v===1) return s; } }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Nie udało się zapisać danych na tym urządzeniu"); } }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ============ Narzędzia ============ */
function today(){ return dkey(new Date()); }
function dkey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+dd; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function fmt(n,max){ return Number(n).toLocaleString("pl-PL",{maximumFractionDigits:max==null?1:max}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function plural(n,forms){ n=Math.abs(n); if(n===1) return forms[0]; const d=n%10, h=n%100; if(!Number.isInteger(n)) return forms[1]; if(d>=2&&d<=4&&(h<12||h>14)) return forms[1]; return forms[2]; }
function unitWord(p,n){ return plural(n, UNITS[p.unit]||UNITS.porcja); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function dayLabel(k){ const d=parseKey(k); const t=today(); if(k===t) return "Dziś"; if(k===addDays(t,-1)) return "Wczoraj"; return d.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"}); }
function longDate(k){ return parseKey(k).toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"}); }
function shortDate(k){ return parseKey(k).toLocaleDateString("pl-PL",{day:"numeric",month:"short"}); }
function norms(){ const p=S.profile; if(!p) return null; if(p.state==="preg") return NORMS.preg; if(p.state==="lact") return NORMS.lact; return (NORMS[p.sex]||NORMS.m)[p.age]; }
function gisFor(n){ if(n==="d" && S.profile && S.profile.age==="75+") return 100; return NUTR[n].gis; }
function taken(k,pid){ return (S.log[k]&&S.log[k][pid])||0; }
function totals(k){ const t={}; const byType={}; for(const p of S.products){ const u=taken(k,p.id); if(!u) continue; for(const n in p.content){ const v=(p.content[n]||0)*u; if(!v) continue; t[n]=(t[n]||0)+v; byType[n]=byType[n]||{}; byType[n][p.type]=(byType[n][p.type]||0)+v; } } return {t,byType}; }
function activeNutrients(){ const s=new Set(); for(const p of S.products) for(const n in p.content) if(p.content[n]) s.add(n); return ORDER.filter(n=>s.has(n)); }
function status(n,v){
  const ul=NUTR[n].ul, gis=gisFor(n);
  if(!v) return {c:"none",t:"Brak dziś"};
  if(v>ul+1e-9) return {c:"bad",t:"Powyżej UL"};
  if(v>=ul-1e-9) return {c:"warn",t:"Na granicy UL"};
  if(v>gis+1e-9) return {c:"warn",t:"Powyżej limitu GIS"};
  return {c:"ok",t:"Poniżej limitów"};
}
function stockLeft(p){ if(!p.stock || p.stock.count==null) return null; let used=0; for(const k in S.log){ if(k>=p.stock.since) used+= (S.log[k][p.id]||0); } return Math.max(0, p.stock.count-used); }
function runOut(p){ const left=stockLeft(p); if(left==null || !p.daily) return null; const days=Math.floor(left/p.daily); return {left,days,date:addDays(today(),days)}; }

/* ============ Ikony ============ */
const I = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>',
  hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>',

  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',

  </section>`;

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function doseText(p,u){ return Object.keys(p.content).filter(n=>p.content[n]).map(n=>`${fmt(p.content[n]*u)} ${NUTR[n].unit} ${SHORT[n]}${n==="d"?` (${fmt(p.content[n]*u*40,0)} IU)`:""}`).join(" + "); }
function nutrientCard(n,v,bt){
  const N=NUTR[n], nm=norms()||{}, norm=nm[n], gis=gisFor(n), st=status(n,v);
  const marks=[["RWS",N.rws,""],["norma",norm,""],["GIS",gis,""],["UL",N.ul,"ul"]].filter(m=>m[1]);
  const max=Math.max(N.ul*1.2, v*1.08, gis*1.08);
  const pct=x=>Math.min(100,x/max*100);
  // etykiety znaczników: łącz równe wartości, rozkładaj w rzędach bez kolizji
  const groups=[]; marks.slice().sort((a,b)=>a[1]-b[1]).forEach(m=>{ const g=groups.find(g=>Math.abs(g.v-m[1])<1e-9); if(g){ g.names.push(m[0]); if(m[2]) g.cls=m[2]; } else groups.push({v:m[1],names:[m[0]],cls:m[2]}); });
  const rows=[]; const labels=groups.map(g=>{ const x=pct(g.v); const w=Math.max(9,g.names.join(" · ").length*1.9); let row=0; while((rows[row]||[]).some(o=>Math.abs(o.x-x)<(o.w+w)/2+1)) row++; (rows[row]=rows[row]||[]).push({x,w}); return {m:[g.names.join(" · "),g.v,g.cls],x,row}; });
  const onlyLek = bt.lek && !bt.suplement;
  return `<div class="card">
    <div class="ntop"><div><div class="nname"><i class="dot ${n}"></i>${N.name}</div>
      <div style="margin-top:8px" class="big num">${fmt(v)}<small>${N.unit}</small></div>
      ${n==="d"?`<div class="alt num">${fmt(v*40,0)} IU</div>`:""}</div>
      <span class="chip ${st.c}">${st.t}</span></div>
    <div class="scale" role="img" aria-label="${N.name}: ${fmt(v)} ${N.unit} na skali do górnego limitu ${N.ul} ${N.unit}">
      <div class="track"></div><div class="fillbar" style="width:${pct(v)}%;background:var(--${n})"></div>
      ${labels.map(({m,x,row})=>`<i class="mark ${m[2]}" style="left:calc(${x}% - 1px)"></i><span class="mlabel" style="left:${x}%;top:${26+row*12}px">${m[0]}</span>`).join("")}
    </div>
    <div class="cmp" style="margin-top:${Math.max(...labels.map(l=>l.row),0)*12}px">
      <div><span>Etykieta (RWS ${fmt(N.rws)} ${N.unit})</span><span class="num">${fmt(v/N.rws*100,0)}%</span></div>
      ${norm?`<div><span>Twoja norma dzienna (${fmt(norm)} ${N.unit})</span><span class="num">${fmt(v/norm*100,0)}%</span></div>`:""}
      <div><span>Limit GIS dla suplementu (${fmt(gis)} ${N.unit})</span><span class="num">${v>gis+1e-9?"powyżej":"poniżej"}</span></div>
      <div><span>Górny limit UL (${fmt(N.ul)} ${N.unit})</span><span class="num">${fmt(v/N.ul*100,0)}%</span></div>
    </div>
    ${n==="mg"&&v?`<div class="note">${N.ulNote} Normę ${norm?fmt(norm)+" mg ":""}liczy się z dietą łącznie, więc resztę zwykle daje jedzenie.</div>`:""}
    ${n==="d"&&v>=N.ul-1e-9?`<div class="note warn">${fmt(v)} µg to ${v>N.ul?"więcej niż":"dokładnie"} górny bezpieczny poziom spożycia z diety i suplementów. ${onlyLek?"Twój produkt to lek, więc limit GIS dla suplementów go nie dotyczy. ":""}O dawkę i badanie poziomu 25(OH)D zapytaj lekarza lub farmaceutę.</div>`:""}
    ${n==="d"&&v>gis&&v<N.ul-1e-9&&!onlyLek?`<div class="note warn">Powyżej limitu, który Zespół ds. Suplementów Diety przy GIS przyjął dla jednej dziennej porcji suplementu.</div>`:""}
  </div>`;
}

/* ============ Historia ============ */
function viewHist(){
  const ns=activeNutrients();
  if(!ns.length) return `<section class="screen"><div class="head"><h1>Historia</h1></div><div class="card empty">Dodaj produkty w Apteczce, a tu zobaczysz swoje ostatnie 30 dni.</div></section>`;
  if(!ns.includes(KNOW)) KNOW=ns[0];
  const n=KNOW, days=[...Array(30)].map((_,i)=>addDays(today(),i-29));
  const vals=days.map(k=>totals(k).t[n]||0);
  const st=streak(), adh=adherence(30);
  const labs=S.labs.filter(l=>l.n===n).sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="screen">
  <div class="head"><div><div class="sub">Ostatnie 30 dni</div><h1>Historia</h1></div></div>
  <div class="stat"><div><b class="num">${st}</b><span>${plural(st,["dzień","dni","dni"])} z rzędu wszystko</span></div><div><b class="num">${adh.full}/${adh.n}</b><span>dni z kompletem</span></div><div><b class="num">${adh.pct}%</b><span>przyjętych dawek</span></div></div>
  <div class="seg" role="group" aria-label="Składnik">${ns.map(x=>`<button data-know="${x}" class="${x===n?"on":""}">${NUTR[x].name.replace("Witamina","Wit.")}</button>`).join("")}</div>
  <div class="card chart"><div class="nname"><i class="dot ${n}"></i>${NUTR[n].name} dziennie (${NUTR[n].unit})</div>
    ${chartSVG(days,vals,n)}<div class="sel num" id="hsel">Dotknij słupka, aby zobaczyć dzień.</div></div>
  <div class="card"><div class="pname">Kalendarz przyjęć</div>${calendar()}<div class="pmeta">Pełny kolor: wszystkie produkty. Jaśniejszy: część.</div></div>
  ${n==="d"?`<div class="card"><div class="pname">Wyniki badań 25(OH)D</div>
    ${labs.length?`<dl class="kv">${labs.map(l=>`<dt>${esc(shortDate(l.date))} ${parseKey(l.date).getFullYear()}</dt><dd class="num">${fmt(l.value)} ${esc(l.unit)}</dd>`).join("")}</dl>`:`<div class="pmeta">Brak zapisanych wyników. Wassup tylko zapisuje wynik, interpretację zostaw lekarzowi.</div>`}
    <button class="btn sec" data-act="lab">Dodaj wynik</button></div>`:""}
  </section>`;
}
function streak(){ if(!S.products.length) return 0; let k=today(); const full=x=>S.products.every(p=>taken(x,p.id)>=p.daily); if(!full(k)) k=addDays(k,-1); let c=0; while(full(k) && c<3650){ c++; k=addDays(k,-1); } return c; }
function adherence(N){ let full=0,need=0,got=0,n=0; const start=S.created||today(); for(let i=0;i<N;i++){ const k=addDays(today(),-i); if(k<start) break; n++; let all=true; for(const p of S.products){ need+=p.daily; got+=Math.min(taken(k,p.id),p.daily); if(taken(k,p.id)<p.daily) all=false; } if(all && S.products.length) full++; } return {full,n,pct:need?Math.round(got/need*100):0}; }
function chartSVG(days,vals,n){
  const W=340,H=170,L=34,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B, N=NUTR[n], norm=(norms()||{})[n];
  const max=Math.max(N.ul*1.15, ...vals)*1.0;
  const y=v=>T+ph-(v/max)*ph, bw=pw/days.length;
  const ticks=niceTicks(max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${N.name} dziennie przez 30 dni">`;
  ticks.forEach(t=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-5}" y="${y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t,0)}</text>`; });
  days.forEach((k,i)=>{ const v=vals[i], x=L+i*bw+1, w=Math.max(2,bw-2); const h=Math.max(v?3:1.5,(v/max)*ph);
    s+=`<rect x="${x}" y="${T+ph-h}" width="${w}" height="${h}" rx="${Math.min(3,w/2)}" fill="${v?`var(--${n})`:"var(--line)"}"/>`;
    s+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ph+B}" fill="transparent" data-day="${k}" data-v="${v}"/>`; });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(N.ul)}" y2="${y(N.ul)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${y(N.ul)-4}" text-anchor="end" font-size="10" fill="var(--bad)">UL ${fmt(N.ul)}</text>`;
  if(norm && norm<max) s+=`<line x1="${L}" x2="${W-R}" y1="${y(norm)}" y2="${y(norm)}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${L+4}" y="${y(norm)-4}" font-size="10" fill="var(--muted)">norma ${fmt(norm)}</text>`;
  [0,14,29].forEach(i=>{ s+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="${i===0?"start":i===29?"end":"middle"}" font-size="10" fill="var(--muted)">${esc(i===29?"dziś":shortDate(days[i]))}</text>`; });
  return s+"</svg>";
}
function niceTicks(max){ const raw=max/3, mag=Math.pow(10,Math.floor(Math.log10(raw))); const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw); const out=[]; for(let v=0; v<=max+1e-9; v+=step) out.push(+v.toFixed(6)); return out; }
function bindChart(){ const svg=document.querySelector(".chart svg"); if(!svg) return; svg.addEventListener("click",e=>{ const k=e.target.getAttribute("data-day"); if(!k) return; const v=+e.target.getAttribute("data-v"); document.getElementById("hsel").textContent=`${cap(longDate(k))}: ${fmt(v)} ${NUTR[KNOW].unit}${KNOW==="d"?` (${fmt(v*40,0)} IU)`:""}`; }); }
function calendar(){
  const t=today(); const start=addDays(t,-34); const first=parseKey(start); const offset=(first.getDay()+6)%7;
  let cells=["pn","wt","śr","cz","pt","so","nd"].map(d=>`<span style="background:none">${d}</span>`).join("");
  for(let i=0;i<offset;i++) cells+=`<span style="background:none"></span>`;
  for(let i=0;i<35;i++){ const k=addDays(start,i); const tk=S.products.map(p=>Math.min(1,taken(k,p.id)/p.daily)); const sum=tk.reduce((a,b)=>a+b,0);
    const cls=k>t?"future":sum>=S.products.length&&S.products.length?"full":sum>0?"part":""; cells+=`<span class="${cls} ${k===t?"today":""} num">${parseKey(k).getDate()}</span>`; }
  return `<div class="cal">${cells}</div>`;
}

  <div class="card"><div class="pname">Co wolno o nim powiedzieć</div>
    <div class="pmeta">Dopuszczone w UE oświadczenia zdrowotne (rozp. 432/2012). Inne obietnice na etykietach i w reklamach są niedozwolone.</div>
    <ul class="claims">${N.claims.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
  </section>`;
}

/* ============ Ty ============ */
function viewMe(){
  const p=S.profile; const days=Object.keys(S.log).length;
  return `<section class="screen">
  <div class="head"><div><div class="sub">Profil, przypomnienia, dane</div><h1>Ty</h1></div></div>
  <div class="card"><div class="pname">Profil</div>
    <div class="seg" role="group" aria-label="Płeć">${[["m","Mężczyzna"],["f","Kobieta"]].map(([v,l])=>`<button data-sex="${v}" class="${p.sex===v?"on":""}">${l}</button>`).join("")}</div>
    <label class="f">Wiek<select id="me-age">${AGES.map(a=>`<option value="${a}" ${p.age===a?"selected":""}>${a==="75+"?"powyżej 75 lat":a.replace("-","–")+" lat"}</option>`).join("")}</select></label>
    ${p.sex==="f"?`<label class="f">Stan<select id="me-state"><option value="none">brak szczególnego</option><option value="preg" ${p.state==="preg"?"selected":""}>ciąża</option><option value="lact" ${p.state==="lact"?"selected":""}>karmienie piersią</option></select></label>`:""}
  </div>
  <div class="card"><div class="pname">Codzienne przypomnienie</div>
    <div class="pmeta">Dodaje powtarzające się wydarzenie do Kalendarza na iPhonie (z alarmem). Wybierz godzinę i stuknij przycisk.</div>
    <label class="f">Godzina<select id="rem-time">${remTimes().map(t=>`<option value="${t}" ${t==="0800"?"selected":""}>${t.slice(0,2)}:${t.slice(2)}</option>`).join("")}</select></label>
    <button class="btn sec" data-act="reminder">Dodaj do Kalendarza</button></div>
  <div class="card"><div class="pname">Twoje dane</div>
    <div class="pmeta">Wszystko jest zapisane tylko na tym telefonie (${days} ${plural(days,["dzień","dni","dni"])} historii). Zrób kopię co jakiś czas, żeby nic nie zginęło.</div>
    <div class="btns"><button class="btn sec" data-act="export">Eksportuj kopię</button><button class="btn sec" data-act="import">Importuj kopię</button></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button class="btn danger" data-act="wipe">Usuń wszystkie dane</button></div>
  <div class="card"><div class="pname">O aplikacji</div>
    <div class="pmeta">Wassup ${APP_VERSION} · wersja testowa. Wassup informuje i liczy, ale nie zaleca dawek ani nie zastępuje porady lekarza lub farmaceuty. Suplementy są dla osób zdrowych i nie zastępują zróżnicowanej diety.</div></div>
  </section>`;
}
function remTimes(){ const o=[]; for(let h=6;h<24;h++) for(const m of ["00","30"]) o.push(String(h).padStart(2,"0")+m); return o; }

/* ============ Arkusze (sheets) ============ */
function sheet(html){ const o=document.getElementById("overlay"); o.innerHTML=`<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; }
function closeSheet(){ document.getElementById("overlay").innerHTML=""; }
let QTY=null;
function qtySheet(id){ const p=S.products.find(x=>x.id===id); QTY={id,u:taken(DAY,id)};
  sheet(`<h2>${esc(p.name)}</h2><div class="pmeta">${esc(cap(dayLabel(DAY)))}: ile ${UNITS[p.unit][2]} przyjąłeś?</div>
  <div class="stepper"><button data-act="q-" aria-label="Mniej">−</button><b class="num" id="qv">${QTY.u}</b><button data-act="q+" aria-label="Więcej">+</button></div>
  <div class="pmeta" id="qd" style="text-align:center">${doseText(p,QTY.u)||"0"}</div>
  <button class="btn full" data-act="q-save">Zapisz</button>`); }
function productSheet(id){
  const p=id?S.products.find(x=>x.id===id):null;
  const v=p||{name:"",brand:"",type:"suplement",unit:"kapsulka",content:{},daily:1,producerDaily:"",form:""};
  sheet(`<h2>${p?"Edytuj produkt":"Dodaj produkt"}</h2>
  ${!p?`<div class="pmeta">Z katalogu</div><div class="list">${CATALOG.filter(c=>!S.products.some(x=>x.cid===c.cid)).map(c=>`<button class="row" style="width:100%;text-align:left" data-act="cat-add" data-cid="${c.cid}"><div class="dots">${Object.keys(c.content).map(n=>`<i class="dot ${n}"></i>`).join("")}</div><div class="grow"><div class="pname">${esc(c.name)}</div><div class="pmeta">${esc(c.brand)} · ${compText(c)}</div></div><span class="pmeta">Dodaj</span></button>`).join("")||`<div class="row pmeta">Wszystkie produkty z katalogu są już w Apteczce.</div>`}</div><div class="pmeta">albo wpisz własny z etykiety</div>`:""}
  <label class="f">Nazwa<input id="p-name" value="${esc(v.name)}" placeholder="np. Magnez Forte"></label>
  <div class="f-row"><label class="f">Marka<input id="p-brand" value="${esc(v.brand)}"></label>
  <label class="f">Rodzaj<select id="p-type"><option value="suplement">Suplement diety</option><option value="lek" ${v.type==="lek"?"selected":""}>Lek OTC</option></select></label></div>
  <label class="f">Jednostka<select id="p-unit">${Object.keys(UNITS).map(u=>`<option value="${u}" ${v.unit===u?"selected":""}>${UNITS[u][0]}</option>`).join("")}</select></label>
  <div class="pmeta">Zawartość w 1 jednostce (z tabeli składu na etykiecie):</div>
  <div class="f-row"><label class="f">Magnez (mg)<input id="p-mg" inputmode="decimal" value="${v.content.mg??""}"></label><label class="f">Witamina D (µg)<input id="p-d" inputmode="decimal" value="${v.content.d??""}" placeholder="IU ÷ 40"></label></div>
  <div class="f-row"><label class="f">Witamina B6 (mg)<input id="p-b6" inputmode="decimal" value="${v.content.b6??""}"></label><label class="f">Forma (opcjonalnie)<input id="p-form" value="${esc(v.form||"")}" placeholder="np. cytrynian"></label></div>
  <div class="f-row"><label class="f">Twoja porcja dzienna<input id="p-daily" inputmode="decimal" value="${v.daily}"></label><label class="f">Zalecenie producenta<input id="p-prod" inputmode="decimal" value="${v.producerDaily||""}"></label></div>
  <label class="f">Ile sztuk zostało w opakowaniu (opcjonalnie)<input id="p-stock" inputmode="numeric" value="${p&&stockLeft(p)!=null?stockLeft(p):""}"></label>
  <button class="btn full" data-act="p-save" data-id="${p?p.id:""}">Zapisz</button>
  ${p?`<button class="btn danger full" data-act="p-del" data-id="${p.id}">Usuń z Apteczki</button>`:""}`);
}
function labSheet(){ sheet(`<h2>Wynik 25(OH)D</h2><div class="pmeta">Zapisz wynik z badania krwi. Wassup go nie interpretuje.</div>
  <div class="f-row"><label class="f">Data<input id="l-date" type="date" value="${today()}"></label><label class="f">Wynik<input id="l-val" inputmode="decimal" placeholder="np. 32"></label></div>
  <label class="f">Jednostka<select id="l-unit"><option>ng/ml</option><option>nmol/l</option></select></label>
  <button class="btn full" data-act="l-save">Zapisz</button>`); }

/* ============ Akcje ============ */
function num(id){ const el=document.getElementById(id); if(!el) return null; const v=parseFloat(String(el.value).replace(",",".")); return isFinite(v)?v:null; }
function fromCatalog(cid){ const c=CATALOG.find(x=>x.cid===cid); return { id:uid(), cid:c.cid, name:c.name, brand:c.brand, type:c.type, unit:c.unit, content:{...c.content}, form:c.form, daily:1, producerDaily:c.producerDaily, info:c.info, stock:null }; }
let toastT;
function toast(msg){ clearTimeout(toastT); let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; toastT=setTimeout(()=>t.remove(),2600); }

document.addEventListener("click", async e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ TAB=tab.dataset.tab; if(TAB==="today") DAY=today(); render(); window.scrollTo(0,0); return; }
  const kn=e.target.closest("[data-know]"); if(kn){ KNOW=kn.dataset.know; render(); return; }
  const sx=e.target.closest("[data-ob-sex]"); if(sx){ OB.sex=sx.dataset.obSex; render(); return; }
  const pk=e.target.closest("[data-ob-pick]"); if(pk){ OB.pick[pk.dataset.obPick]=!OB.pick[pk.dataset.obPick]; render(); return; }
  const ms=e.target.closest("[data-sex]"); if(ms){ S.profile.sex=ms.dataset.sex; if(S.profile.sex==="m") S.profile.state="none"; save(); render(); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="close-bg"){ if(e.target===a) closeSheet(); return; }
  if(act==="ob-done"){ S.profile={sex:OB.sex, age:(document.getElementById("ob-age")||{}).value||OB.age, state:OB.sex==="f"?((document.getElementById("ob-state")||{}).value||"none"):"none"}; S.created=today();
    S.products=CATALOG.filter(c=>OB.pick[c.cid]).map(c=>fromCatalog(c.cid)); save(); TAB="today"; render(); return; }
  if(act==="day-prev"){ DAY=addDays(DAY,-1); render(); return; }
  if(act==="day-next"){ if(DAY<today()) DAY=addDays(DAY,1); render(); return; }
  if(act==="toggle"){ const p=S.products.find(x=>x.id===id); S.log[DAY]=S.log[DAY]||{}; const cur=S.log[DAY][id]||0; S.log[DAY][id]= cur>=p.daily? 0 : p.daily; if(!S.log[DAY][id]) delete S.log[DAY][id]; if(!Object.keys(S.log[DAY]).length) delete S.log[DAY]; save(); render(); try{ navigator.vibrate&&navigator.vibrate(10); }catch(_){} return; }
  if(act==="qty"){ qtySheet(id); return; }
  if(act==="q-"||act==="q+"){ QTY.u=Math.max(0,Math.min(10,QTY.u+(act==="q+"?1:-1))); const p=S.products.find(x=>x.id===QTY.id); document.getElementById("qv").textContent=QTY.u; document.getElementById("qd").textContent=doseText(p,QTY.u)||"0"; return; }
  if(act==="q-save"){ S.log[DAY]=S.log[DAY]||{}; if(QTY.u) S.log[DAY][QTY.id]=QTY.u; else delete S.log[DAY][QTY.id]; if(!Object.keys(S.log[DAY]).length) delete S.log[DAY]; save(); closeSheet(); render(); return; }
  if(act==="add"){ productSheet(null); return; }
  if(act==="edit"){ productSheet(id); return; }
  if(act==="cat-add"){ S.products.push(fromCatalog(a.dataset.cid)); save(); closeSheet(); render(); toast("Dodano do Apteczki"); return; }
  if(act==="p-save"){
    const name=(document.getElementById("p-name").value||"").trim(); if(!name){ toast("Wpisz nazwę produktu"); return; }
    const content={}; const mg=num("p-mg"), d=num("p-d"), b6=num("p-b6"); if(mg) content.mg=mg; if(d) content.d=d; if(b6) content.b6=b6;
    if(!Object.keys(content).length){ toast("Podaj zawartość co najmniej jednego składnika"); return; }
    let p=id?S.products.find(x=>x.id===id):null; if(!p){ p={id:uid(),stock:null}; S.products.push(p); }
    Object.assign(p,{ name, brand:document.getElementById("p-brand").value.trim(), type:document.getElementById("p-type").value, unit:document.getElementById("p-unit").value, content, form:document.getElementById("p-form").value.trim(), daily:num("p-daily")||1, producerDaily:num("p-prod")||null });
    const st=num("p-stock"); if(st!=null) p.stock={count:st+takenSinceToday(p), since:today()};
    save(); closeSheet(); render(); toast("Zapisano"); return; }
  if(act==="p-del"){ S.products=S.products.filter(x=>x.id!==id); save(); closeSheet(); render(); toast("Usunięto z Apteczki"); return; }
  if(act==="refill"){ const p=S.products.find(x=>x.id===id); const c=CATALOG.find(x=>x.cid===p.cid); const left=stockLeft(p)||0; const add=(c&&c.pack)||30; p.stock={count:left+add+takenSinceToday(p), since:today()}; save(); render(); toast(`Dodano ${add} ${unitWord(p,add)}. Liczbę zmienisz w Edytuj.`); return; }
  if(act==="lab"){ labSheet(); return; }
  if(act==="l-save"){ const v=num("l-val"); const dt=document.getElementById("l-date").value; if(v==null||!dt){ toast("Podaj datę i wynik"); return; } S.labs.push({n:"d",date:dt,value:v,unit:document.getElementById("l-unit").value}); save(); closeSheet(); render(); return; }
  if(act==="reminder"){ const t=document.getElementById("rem-time").value; window.location.href=`reminders/przypomnienie-${t}.ics`; return; }
  if(act==="export"){ await exportData(); return; }
  if(act==="import"){ document.getElementById("import-file").click(); return; }
  if(act==="wipe"){ wipeSheet(); return; }
  if(act==="wipe-yes"){ S=blank(); save(); closeSheet(); TAB="today"; render(); return; }
  if(act==="close"){ closeSheet(); return; }
});
function takenSinceToday(p){ return taken(today(),p.id); }
function wipeSheet(){ sheet(`<h2>Usunąć wszystkie dane?</h2><div class="pmeta">Profil, Apteczka i cała historia znikną z tego telefonu. Tego nie da się cofnąć, chyba że masz kopię.</div><button class="btn danger full" data-act="wipe-yes">Usuń wszystko</button><button class="btn sec full" data-act="close">Anuluj</button>`); }
async function exportData(){
  const name=`wassup-kopia-${today()}.json`; const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  try{ const file=new File([blob],name,{type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Kopia Wassup"}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.addEventListener("change", e=>{
  if(e.target.id==="me-age"){ S.profile.age=e.target.value; save(); render(); }
  if(e.target.id==="me-state"){ S.profile.state=e.target.value; save(); render(); }
  if(e.target.id==="ob-age"){ OB.age=e.target.value; }
  if(e.target.id==="ob-state"){ OB.state=e.target.value; }
  if(e.target.id==="import-file"){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||d.v!==1||!Array.isArray(d.products)) throw 0; S=d; save(); render(); toast("Wczytano kopię"); }catch(_){ toast("To nie jest plik kopii Wassup"); } }; r.readAsText(f); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="iu"){ const v=parseFloat(e.target.value.replace(",",".")); document.getElementById("ug").value=isFinite(v)?fmt(v/40,2):""; }
  if(e.target.id==="ug"){ const v=parseFloat(e.target.value.replace(",",".")); document.getElementById("iu").value=isFinite(v)?fmt(v*40,0).replace(/\s/g,""):""; }
});
// Nowy dzień po powrocie do aplikacji
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && TAB==="today" && DAY!==today()){ DAY=today(); render(); } });

render();
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|artifact/.test(location.hostname)){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
</script>
</body>
</html>
